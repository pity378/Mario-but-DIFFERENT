<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jump Quest: Different!</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: system-ui, sans-serif;
      color: #242044;
      background: linear-gradient(#b8ecff, #f8e9ff);
      text-align: center;
    }

    main {
      width: min(100%, 850px);
    }

    h1 {
      margin: 4px 0;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0;
      font-weight: bold;
      flex-wrap: wrap;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 4px solid white;
      border-radius: 18px;
      background: #8be0ff;
      box-shadow: 0 8px 24px #423b6333;
      touch-action: none;
    }

    #message {
      min-height: 1.5em;
      font-weight: bold;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
    }

    .controls button, #restart {
      min-width: 68px;
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      color: white;
      background: #785cf4;
      font-size: 1.4rem;
      font-weight: bold;
      box-shadow: 0 4px 0 #523bc5;
      touch-action: none;
      cursor: pointer;
    }

    #jump {
      background: #ff6599;
      box-shadow: 0 4px 0 #d33f76;
    }

    #restart {
      min-height: 44px;
      font-size: 1rem;
    }

    .start-panel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(18, 24, 35, 0.24);
      border-radius: 18px;
    }

    .start-box {
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.16);
      max-width: 320px;
      margin: auto;
    }

    .start-box h2 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .start-box p {
      margin: 0 0 14px;
      font-weight: 700;
    }

    .start-box button {
      border: 0;
      background: linear-gradient(#7d68ff, #5d46d8);
      color: white;
      font-weight: bold;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #4736ae;
    }
  </style>
</head>
<body>
  <main>
    <h1>🍄 Jump Quest: Different!</h1>

    <div id="hud">
      <span>🪙 Coins: <span id="coins">0</span></span>
      <span>🚩 Goal: reach the flag!</span>
    </div>

    <div style="position:relative;">
      <canvas id="game" width="800" height="420" aria-label="Platform jumping game"></canvas>

      <div id="startPanel" class="start-panel">
        <div class="start-box">
          <h2>JUMP!</h2>
          <p>Collect coins, dodge enemies, and reach the flag.</p>
          <button id="startBtn">Play</button>
        </div>
      </div>
    </div>

    <p id="message">Press play to start.</p>

    <div class="controls">
      <button id="left" aria-label="Move left">⬅️</button>
      <button id="jump" aria-label="Jump">⬆️</button>
      <button id="right" aria-label="Move right">➡️</button>
    </div>

    <p><button id="restart">Restart</button></p>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const coinsDisplay = document.getElementById("coins");
    const message = document.getElementById("message");
    const startPanel = document.getElementById("startPanel");
    const startBtn = document.getElementById("startBtn");

    const levelEnd = 2400;
    const player = {
      x: 45, y: 306, w: 38, h: 54,
      vx: 0, vy: 0, onGround: true
    };
    const keys = { left: false, right: false };

    let cameraX = 0;
    let coins = 0;
    let gameStarted = false;
    let gameFinished = false;

    const platforms = [
      { x: 0, y: 360, w: 400, h: 80 },
      { x: 490, y: 360, w: 340, h: 80 },
      { x: 920, y: 360, w: 360, h: 80 },
      { x: 1370, y: 360, w: 360, h: 80 },
      { x: 1820, y: 360, w: 580, h: 80 },
      { x: 230, y: 280, w: 100, h: 18 },
      { x: 600, y: 275, w: 100, h: 18 },
      { x: 1050, y: 280, w: 110, h: 18 },
      { x: 1510, y: 270, w: 110, h: 18 },
      { x: 1940, y: 280, w: 110, h: 18 }
    ];

    const enemies = [
      { x: 690, y: 330, w: 28, h: 30, dir: 1, speed: 1.2 },
      { x: 1180, y: 330, w: 28, h: 30, dir: -1, speed: 1.5 },
      { x: 1690, y: 330, w: 28, h: 30, dir: 1, speed: 1.8 },
      { x: 2070, y: 330, w: 28, h: 30, dir: -1, speed: 2.1 }
    ];

    const treasures = [
      { x: 265, y: 238, got: false },
      { x: 360, y: 310, got: false },
      { x: 645, y: 232, got: false },
      { x: 790, y: 310, got: false },
      { x: 1090, y: 236, got: false },
      { x: 1215, y: 310, got: false },
      { x: 1550, y: 226, got: false },
      { x: 1665, y: 310, got: false },
      { x: 1980, y: 236, got: false },
      { x: 2160, y: 310, got: false }
    ];

    function overlaps(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function jump() {
      if (!gameStarted || gameFinished) return;
      if (player.onGround) {
        player.vy = -14;
        player.onGround = false;
      }
    }

    function reset() {
      player.x = 45;
      player.y = 306;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
      cameraX = 0;
      coins = 0;
      gameFinished = false;

      enemies.forEach(enemy => {
        enemy.x = [690, 1180, 1690, 2070][enemies.indexOf(enemy)];
        enemy.dir = enemies.indexOf(enemy) % 2 === 0 ? 1 : -1;
      });

      treasures.forEach(coin => coin.got = false);
      coinsDisplay.textContent = coins;
      message.textContent = "Collect coins. Avoid enemies. Reach the flag!";
    }

    function startGame() {
      gameStarted = true;
      startPanel.style.display = "none";
      reset();
      message.textContent = "Go! Dodge the enemies and grab the coins!";
    }

    function update() {
      if (!gameStarted || gameFinished) return;

      player.vx = (keys.right ? 7 : 0) - (keys.left ? 7 : 0);
      player.x += player.vx;
      player.x = Math.max(0, Math.min(levelEnd - player.w, player.x));

      const previousBottom = player.y + player.h;
      player.vy += 0.55;
      player.y += player.vy;
      player.onGround = false;

      for (const platform of platforms) {
        const crossedTop =
          previousBottom <= platform.y &&
          player.y + player.h >= platform.y;
        const overlapsPlatform =
          player.x + player.w > platform.x &&
          player.x < platform.x + platform.w;

        if (crossedTop && overlapsPlatform && player.vy >= 0) {
          player.y = platform.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }

      for (const enemy of enemies) {
        enemy.x += enemy.speed * enemy.dir;

        if (enemy.x < 620 || enemy.x > 2230) {
          enemy.dir *= -1;
        }

        if (overlaps(player, enemy)) {
          message.textContent = "You got bonked by an enemy! Try again!";
          reset();
          startPanel.style.display = "grid";
          startPanel.querySelector("h2").textContent = "Try again!";
          startPanel.querySelector("p").textContent = "Enemies are not friendly. Hit play and go again.";
          gameStarted = false;
          return;
        }
      }

      for (const coin of treasures) {
        if (!coin.got && overlaps(player, {
          x: coin.x, y: coin.y, w: 22, h: 22
        })) {
          coin.got = true;
          coins++;
          coinsDisplay.textContent = coins;
        }
      }

      if (player.y > canvas.height + 90) {
        message.textContent = "You fell in the gap! Try again!";
        reset();
        startPanel.style.display = "grid";
        startPanel.querySelector("h2").textContent = "Retry";
        startPanel.querySelector("p").textContent = "The gap wins sometimes. Hit play and go again.";
        gameStarted = false;
        return;
      }

      if (player.x > levelEnd - 95) {
        gameFinished = true;
        message.textContent = `You did it! You collected ${coins} coins! 🎉`;
      }

      cameraX = Math.max(
        0,
        Math.min(levelEnd - canvas.width, player.x - 250)
      );
    }

    function drawPlayer() {
      const x = player.x - cameraX;
      const y = player.y;

      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.fillRect(x + 5, y + player.h + 3, 28, 5);

      ctx.fillStyle = "#8b542e";
      ctx.fillRect(x + 4, y + 48, 14, 7);
      ctx.fillRect(x + 21, y + 48, 14, 7);

      ctx.fillStyle = "#3978e8";
      ctx.fillRect(x + 7, y + 29, 24, 20);
      ctx.fillRect(x + 10, y + 24, 6, 15);
      ctx.fillRect(x + 22, y + 24, 6, 15);

      ctx.fillStyle = "#f4e9d4";
      ctx.fillRect(x + 8, y + 20, 22, 14);

      ctx.fillStyle = "#eab184";
      ctx.fillRect(x + 2, y + 25, 7, 13);
      ctx.fillRect(x + 29, y + 25, 7, 13);

      ctx.fillStyle = "#f2bd91";
      ctx.fillRect(x + 9, y + 11, 21, 20);

      ctx.fillRect(x + 6, y + 18, 4, 7);
      ctx.fillRect(x + 29, y + 18, 4, 7);

      ctx.fillStyle = "#d84b58";
      ctx.fillRect(x + 7, y + 4, 24, 10);
      ctx.fillRect(x + 3, y + 11, 32, 5);

      ctx.fillStyle = "#f5f0e8";
      ctx.fillRect(x + 17, y + 7, 5, 4);

      ctx.fillStyle = "#28243a";
      ctx.fillRect(x + 14, y + 18, 3, 4);
      ctx.fillRect(x + 24, y + 18, 3, 4);

      ctx.fillStyle = "#49332d";
      ctx.fillRect(x + 11, y + 23, 8, 5);
      ctx.fillRect(x + 20, y + 23, 8, 5);
      ctx.fillRect(x + 16, y + 25, 7, 4);

      ctx.fillStyle = "#ffe477";
      ctx.fillRect(x + 12, y + 32, 3, 3);
      ctx.fillRect(x + 23, y + 32, 3, 3);
    }

    function drawEnemy(enemy) {
      const x = enemy.x - cameraX;
      const y = enemy.y;

      ctx.fillStyle = "#2d2d35";
      ctx.fillRect(x, y, enemy.w, enemy.h);

      ctx.fillStyle = "#ed5b4a";
      ctx.fillRect(x + 4, y + 4, enemy.w - 8, 8);
      ctx.fillStyle = "#f7f8ff";
      ctx.fillRect(x + 8, y + 15, 4, 4);
      ctx.fillRect(x + enemy.w - 12, y + 15, 4, 4);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fff6b8";
      ctx.beginPath();
      ctx.arc(700 - cameraX * 0.15, 75, 35, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      for (const cloud of [
        { x: 130, y: 85 },
        { x: 460, y: 130 },
        { x: 760, y: 95 }
      ]) {
        const x = cloud.x - (cameraX * 0.25 % 900);
        ctx.beginPath();
        ctx.arc(x, cloud.y, 22, 0, Math.PI * 2);
        ctx.arc(x + 25, cloud.y - 8, 28, 0, Math.PI * 2);
        ctx.arc(x + 52, cloud.y, 20, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const platform of platforms) {
        const x = platform.x - cameraX;
        if (x + platform.w < 0 || x > canvas.width) continue;

        ctx.fillStyle = "#56bd65";
        ctx.fillRect(x, platform.y, platform.w, 12);
        ctx.fillStyle = "#9b633e";
        ctx.fillRect(x, platform.y + 12, platform.w, platform.h - 12);
      }

      for (const coin of treasures) {
        if (coin.got) continue;
        const x = coin.x - cameraX;

        ctx.fillStyle = "#ffca28";
        ctx.beginPath();
        ctx.ellipse(x + 11, coin.y + 11, 9, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff1a8";
        ctx.fillRect(x + 9, coin.y + 5, 4, 12);
      }

      for (const enemy of enemies) {
        drawEnemy(enemy);
      }

      const flagX = levelEnd - 85 - cameraX;
      ctx.fillStyle = "#564b74";
      ctx.fillRect(flagX, 250, 7, 110);
      ctx.fillStyle = "#ff5c91";
      ctx.beginPath();
      ctx.moveTo(flagX + 7, 253);
      ctx.lineTo(flagX + 58, 270);
      ctx.lineTo(flagX + 7, 287);
      ctx.fill();

      drawPlayer();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", event => {
      if (["ArrowLeft", "ArrowRight", " ", "ArrowUp"].includes(event.key)) {
        event.preventDefault();
      }

      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        keys.left = true;
      }
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        keys.right = true;
      }
      if (event.key === " " || event.key === "ArrowUp") {
        jump();
      }
    });

    document.addEventListener("keyup", event => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        keys.left = false;
      }
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        keys.right = false;
      }
    });

    function holdButton(id, direction) {
      const button = document.getElementById(id);

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        if (direction === "jump") jump();
        else keys[direction] = true;
      });

      for (const eventName of ["pointerup", "pointercancel", "pointerleave"]) {
        button.addEventListener(eventName, () => {
          if (direction !== "jump") keys[direction] = false;
        });
      }
    }

    holdButton("left", "left");
    holdButton("right", "right");
    holdButton("jump", "jump");
    document.getElementById("restart").addEventListener("click", () => {
      startPanel.style.display = "grid";
      startPanel.querySelector("h2").textContent = "Jump!";
      startPanel.querySelector("p").textContent = "Collect coins, dodge enemies, and reach the flag.";
      gameStarted = false;
      reset();
    });
    startBtn.addEventListener("click", startGame);

    reset();
    loop();
  </script>
</body>
</html>
