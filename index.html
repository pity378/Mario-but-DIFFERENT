<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Temu Bros</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    user-select: none;
  }

  body {
    background: #617de8;
    color: white;
    font-family: system-ui, sans-serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  #hud {
    position: fixed;
    z-index: 2;
    top: max(8px, env(safe-area-inset-top));
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 5px;
    pointer-events: none;
    text-shadow: 0 2px 4px #17213d;
  }

  .badge, .hud-button {
    padding: 7px 9px;
    border: 2px solid #ffffffa8;
    border-radius: 8px;
    color: white;
    background: rgba(23,36,60,.75);
    font: 800 clamp(10px, 2.8vw, 15px) system-ui, sans-serif;
  }

  .hud-button {
    pointer-events: auto;
    cursor: pointer;
  }

  #controls {
    position: fixed;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: max(10px, env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 4px;
    padding: 0 6px;
    pointer-events: none;
  }

  .touch-player {
    display: flex;
    align-items: center;
    gap: clamp(2px, 1vw, 7px);
    pointer-events: none;
  }

  .touch-player:last-child { justify-content: flex-end; }

  .touch-player span {
    font: 900 10px system-ui, sans-serif;
    text-shadow: 0 1px 3px #111;
  }

  .control {
    width: clamp(39px, 10.5vw, 66px);
    height: clamp(44px, 12vw, 66px);
    padding: 0;
    border: 2px solid #ffffffc0;
    border-radius: 12px;
    color: white;
    background: #30346ddd;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 900;
    box-shadow: 0 4px 0 #161a4599;
    pointer-events: auto;
    touch-action: none;
  }

  .jump-button { background: #e95491ee; }
  .pipe-button { background: #31a777ee; font-size: 19px; }

  .control:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #161a4599;
  }

  #screen {
    position: fixed;
    z-index: 5;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: auto;
    padding: 20px;
    background: #617de8;
  }

  #screen::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .22;
    background-image:
      linear-gradient(90deg, transparent 96%, #fff 96%),
      linear-gradient(transparent 96%, #fff 96%);
    background-size: 24px 24px;
    pointer-events: none;
  }

  #menu {
    position: relative;
    width: min(600px, 100%);
    padding: 18px;
    text-align: center;
    font-family: "Courier New", monospace;
  }

  .scoreline {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin: 0 auto 12px;
    max-width: 520px;
    font-size: clamp(11px, 3vw, 17px);
    font-weight: 900;
    text-shadow: 2px 2px #293675;
  }

  #title-plaque {
    width: min(520px, 100%);
    margin: 0 auto 18px;
    padding: clamp(18px, 5vw, 34px) 10px;
    border: 7px solid #793416;
    outline: 4px solid #f7bd83;
    background: #df531d;
    box-shadow: 0 8px 0 #57283a, inset 0 0 0 4px #ff9a55;
    color: #fff0d4;
    text-shadow: 4px 5px 0 #712d28;
  }

  #title-plaque h1 {
    margin: 0;
    font-size: clamp(34px, 10vw, 70px);
    line-height: .95;
    letter-spacing: -4px;
  }

  #title-plaque .subtitle {
    display: block;
    margin-top: 12px;
    font-size: clamp(12px, 3.5vw, 22px);
    font-weight: 900;
    letter-spacing: 2px;
  }

  #menu-message {
    min-height: 46px;
    margin: 12px auto;
    max-width: 470px;
    font: 700 clamp(14px, 3.5vw, 18px)/1.4 system-ui, sans-serif;
  }

  .menu-button {
    display: block;
    width: min(350px, 100%);
    margin: 10px auto;
    padding: 12px;
    border: 3px solid #fff2c6;
    border-radius: 4px;
    color: white;
    background: #287e42;
    box-shadow: 0 5px 0 #174b35;
    font: 900 clamp(15px, 4vw, 21px) "Courier New", monospace;
    cursor: pointer;
  }

  #mode-button { background: #354a9a; box-shadow: 0 5px 0 #233266; }

  #menu-bottom {
    margin-top: 15px;
    font: 700 12px system-ui, sans-serif;
  }

  #screen-language {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 1;
    padding: 8px 12px;
    border: 2px solid white;
    border-radius: 5px;
    color: white;
    background: #293675;
    font-weight: 900;
  }

  .hidden { display: none !important; }

  @media (max-height: 500px) {
    #menu { padding: 6px; }
    #title-plaque { margin-bottom: 10px; padding: 12px 8px; }
    #menu-message { min-height: 30px; margin: 7px auto; }
    #menu-bottom { margin-top: 7px; }
  }
</style>
</head>
<body>
  <canvas id="game" aria-label="Super Temu Bros split-screen game"></canvas>

  <div id="hud">
    <div class="badge">🪙 <span id="coins">0</span> · 💛 <span id="lives">3</span></div>
    <div class="badge" id="levelLabel">WORLD 1-1</div>
    <button class="hud-button" id="language">ES</button>
    <button class="hud-button" id="music">♫</button>
  </div>

  <div id="controls">
    <div class="touch-player">
      <span>P1</span>
      <button class="control" id="p1left">◀</button>
      <button class="control" id="p1right">▶</button>
      <button class="control jump-button" id="p1jump">⬆</button>
    </div>

    <button class="control pipe-button" id="pipe">⬇</button>

    <div class="touch-player">
      <span>P2</span>
      <button class="control" id="p2left">◀</button>
      <button class="control" id="p2right">▶</button>
      <button class="control jump-button" id="p2jump">⬆</button>
    </div>
  </div>

  <div id="screen">
    <button id="screen-language">ES</button>
    <main id="menu">
      <div class="scoreline">
        <span id="menu-coins">COINS 000</span>
        <span id="menu-world">WORLD 1-1</span>
        <span>READY!</span>
      </div>

      <div id="title-plaque">
        <h1>SUPER<br>TEMU BROS</h1>
        <span class="subtitle">BARGAIN KINGDOM ADVENTURE</span>
      </div>

      <p id="menu-message"></p>
      <button class="menu-button" id="mode-button">👤 1 PLAYER</button>
      <button class="menu-button" id="play">▶ START GAME</button>
      <div id="menu-bottom"></div>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const $ = id => document.getElementById(id);

      let width = innerWidth;
      let height = innerHeight;
      let pixelRatio = 1;
      let viewWidth = width;
      let viewHeight = height;
      let groundY = height - 90;
      let running = false;
      let twoPlayers = false;
      let language = "en";
      let coins = 0;
      let lives = 3;
      let worldIndex = 0;
      let lastTime = 0;
      let pickups = [];
      let enemies = [];
      let audioContext = null;
      let musicTimer = null;
      let musicEnabled = true;
      let musicStep = 0;

      const keys = {
        p1Left: false, p1Right: false,
        p2Left: false, p2Right: false
      };

      function makePlayer(x, shirt, bag) {
        return {
          x, y: 0, w: 34, h: 46, vx: 0, vy: 0,
          grounded: false, invulnerable: 0, shirt, bag
        };
      }

      const players = [
        makePlayer(60, "#138b91", "#ffd451"),
        makePlayer(110, "#7355b8", "#69df94")
      ];

      const words = {
        en: {
          intro: "Six worlds! Play solo or team up. Each player gets their own view in 2-player mode.",
          one: "👤 1 PLAYER", two: "👥 2 PLAYERS",
          start: "▶ START GAME", again: "▶ PLAY AGAIN",
          fail: "Game over! Ready for another try?",
          win: "You conquered all six worlds!",
          controls: "P1: ARROWS · P2: WASD · JUMP: UP / W · PIPE: DOWN / S"
        },
        es: {
          intro: "¡Seis mundos! Juega solo o en equipo. En modo 2 jugadores cada uno tiene su propia vista.",
          one: "👤 1 JUGADOR", two: "👥 2 JUGADORES",
          start: "▶ EMPEZAR", again: "▶ JUGAR DE NUEVO",
          fail: "¡Fin del juego! ¿Quieres intentarlo otra vez?",
          win: "¡Conquistaste los seis mundos!",
          controls: "P1: FLECHAS · P2: WASD · SALTAR: ↑ / W · TUBERÍA: ↓ / S"
        }
      };

      const themes = [
        { top:"#5dc8ff", bottom:"#d6f7ff", hill:"#65c88b", dirt:"#986044", grass:"#44bd72", pipe:"#2cb75d", coin:"#ffe27a" },
        { top:"#51b8d5", bottom:"#c8f4ec", hill:"#47aa9b", dirt:"#8b5949", grass:"#42b89c", pipe:"#287f8e", coin:"#ffdc73" },
        { top:"#e89758", bottom:"#ffe1a2", hill:"#bb704d", dirt:"#765044", grass:"#c78c53", pipe:"#468c65", coin:"#fff08a" },
        { top:"#5ab78d", bottom:"#c9f0a2", hill:"#3f9467", dirt:"#705642", grass:"#57b95e", pipe:"#32834d", coin:"#ffe46f" },
        { top:"#343b77", bottom:"#a8a2e8", hill:"#5555a0", dirt:"#634c72", grass:"#6fbe86", pipe:"#59a86a", coin:"#fff0a0" },
        { top:"#f19068", bottom:"#ffe5a7", hill:"#d6a64c", dirt:"#916047", grass:"#71bd66", pipe:"#40975b", coin:"#fff37a" }
      ];

      function makeWorlds() {
        return themes.map((_, index) => {
          const length = 2200 + index * 240;
          const gaps = [];
          const platforms = [];
          const coinsList = [];
          const enemyList = [];

          for (let i = 0; i < 3 + Math.floor(index / 2); i++) {
            const start = 410 + i * 440;
            const end = start + 90 + index * 5;
            gaps.push([start, end]);

            platforms.push([start - 145, 110, 82 + (index % 3) * 7]);
            coinsList.push([start - 105, 145]);
            coinsList.push([end + 55, 70]);

            const enemyX = end + 140;
            if (enemyX < length - 190) {
              enemyList.push([enemyX, enemyX - 40, enemyX + 65, 55 + index * 8]);
            }
          }

          for (let i = 0; i < 3; i++) {
            const x = 245 + i * 600 + index * 20;
            if (x + 130 < length - 180) {
              const h = 105 + ((i + index) % 3) * 10;
              platforms.push([x, 115, h]);
              coinsList.push([x + 50, h + 45]);
            }
          }

          return {
            length,
            gaps,
            platforms,
            coins: coinsList,
            enemies: enemyList,
            pipeX: length - 95
          };
        });
      }

      const worlds = makeWorlds();
      const t = key => words[language][key];
      const world = () => worlds[worldIndex];
      const worldLabel = () => `WORLD ${worldIndex + 1}-1`;

      function resize() {
        width = innerWidth;
        height = innerHeight;
        pixelRatio = Math.min(devicePixelRatio || 1, 2);

        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        if (!twoPlayers) {
          viewWidth = width;
          viewHeight = height;
        } else if (width > height * 1.15) {
          viewWidth = width / 2;
          viewHeight = height;
        } else {
          viewWidth = width;
          viewHeight = height / 2;
        }

        groundY = viewHeight - (viewWidth < 430 ? 82 : 94);

        pickups.forEach(coin => coin.y = groundY - coin.height);
        if (!running) {
          players.forEach(player => {
            player.y = groundY - player.h;
          });
        }

        updateHud();
      }

      function updateHud() {
        $("coins").textContent = coins;
        $("lives").textContent = lives;
        $("levelLabel").textContent = worldLabel();
        $("menu-world").textContent = worldLabel();
        $("menu-coins").textContent = `COINS ${String(coins).padStart(3, "0")}`;
      }

      function updateMenu() {
        $("menu-message").textContent = t("intro");
        $("menu-bottom").textContent = t("controls");
        $("mode-button").textContent = twoPlayers ? t("two") : t("one");
        $("play").textContent = t("start");
        updateHud();
      }

      function setupWorld() {
        const current = world();
        pickups = current.coins.map(([x, h]) => ({
          x, height: h, y: groundY - h, collected: false
        }));

        enemies = current.enemies.map(([x, min, max, speed]) => ({
          x, min, max, speed, direction: 1, alive: true
        }));

        players[0].x = 55;
        players[1].x = 55;

        players.forEach(player => {
          player.y = groundY - player.h;
          player.vx = 0;
          player.vy = 0;
          player.grounded = false;
          player.invulnerable = 0;
        });

        updateHud();
      }

      function startGame() {
        coins = 0;
        lives = 3;
        worldIndex = 0;
        setupWorld();
        running = true;
        $("screen").classList.add("hidden");
        startMusic();
        lastTime = performance.now();
      }

      function finishGame(won) {
        running = false;
        stopMusic();

        $("title-plaque").innerHTML = won
          ? "<h1>WORLD<br>COMPLETE!</h1><span class='subtitle'>SUPER TEMU BROS</span>"
          : "<h1>GAME<br>OVER</h1><span class='subtitle'>SUPER TEMU BROS</span>";

        $("menu-message").textContent = won ? t("win") : t("fail");
        $("play").textContent = t("again");
        $("screen").classList.remove("hidden");
      }

      function startMusic() {
        if (!musicEnabled) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        audioContext ||= new AudioContextClass();
        audioContext.resume();
        clearInterval(musicTimer);

        const notes = [523,659,784,659,587,698,880,698,523,659,784,988,880,784,659,587];

        musicTimer = setInterval(() => {
          if (!running || !musicEnabled || !audioContext) return;
          const now = audioContext.currentTime;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();

          oscillator.type = "square";
          oscillator.frequency.value = notes[musicStep++ % notes.length];
          gain.gain.setValueAtTime(0.022, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.14);
        }, 175);
      }

      function stopMusic() {
        clearInterval(musicTimer);
      }

      function jump(player) {
        if (running && player.grounded) {
          player.vy = -640;
          player.grounded = false;
        }
      }

      function enterPipe() {
        if (!running) return;

        const team = twoPlayers ? players : [players[0]];
        const ready = team.every(player =>
          player.grounded &&
          Math.abs(player.x + player.w / 2 - world().pipeX) < 75
        );

        if (!ready) return;

        if (worldIndex < worlds.length - 1) {
          worldIndex++;
          setupWorld();
        } else {
          finishGame(true);
        }
      }

      function overlaps(a, b) {
        return a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y;
      }

      function loseLife() {
        if (!running || players.some(player => player.invulnerable > 0)) return;

        lives--;
        if (lives <= 0) {
          updateHud();
          finishGame(false);
          return;
        }

        players.forEach((player, index) => {
          player.x = 55 + index * 42;
          player.y = groundY - player.h - 3;
          player.vx = 0;
          player.vy = 0;
          player.grounded = false;
          player.invulnerable = 1.5;
        });

        updateHud();
      }

      function overGap(player) {
        const center = player.x + player.w / 2;
        return world().gaps.some(([a, b]) => center > a && center < b);
      }

      function updatePlayer(player, left, right, dt) {
        player.invulnerable = Math.max(0, player.invulnerable - dt);
        player.vx = ((right ? 1 : 0) - (left ? 1 : 0)) * 270;
        player.x = Math.max(0, Math.min(world().length - player.w, player.x + player.vx * dt));

        const oldBottom = player.y + player.h;
        player.vy += 1650 * dt;
        player.y += player.vy * dt;
        player.grounded = false;

        if (
          !overGap(player) &&
          player.vy >= 0 &&
          oldBottom <= groundY + 2 &&
          player.y + player.h >= groundY
        ) {
          player.y = groundY - player.h;
          player.vy = 0;
          player.grounded = true;
        }

        for (const [x, w, h] of world().platforms) {
          const platformY = groundY - h;
          if (
            player.x + player.w > x &&
            player.x < x + w &&
            player.vy >= 0 &&
            oldBottom <= platformY + 3 &&
            player.y + player.h >= platformY
          ) {
            player.y = platformY - player.h;
            player.vy = 0;
            player.grounded = true;
          }
        }
      }

      function update(dt) {
        if (!running) return;
        dt = Math.min(dt, 0.033);

        updatePlayer(players[0], keys.p1Left, keys.p1Right, dt);
        if (twoPlayers) {
          updatePlayer(players[1], keys.p2Left, keys.p2Right, dt);
        }

        const activePlayers = twoPlayers ? players : [players[0]];

        for (const coin of pickups) {
          if (coin.collected) continue;
          if (activePlayers.some(player =>
            overlaps(player, { x: coin.x - 10, y: coin.y - 12, w: 20, h: 24 })
          )) {
            coin.collected = true;
            coins++;
            updateHud();
          }
        }

        for (const enemy of enemies) {
          if (!enemy.alive) continue;

          enemy.x += enemy.direction * enemy.speed * dt;
          if (enemy.x < enemy.min || enemy.x > enemy.max) {
            enemy.direction *= -1;
            enemy.x = Math.max(enemy.min, Math.min(enemy.max, enemy.x));
          }

          const box = { x: enemy.x, y: groundY - 30, w: 32, h: 30 };

          for (const player of activePlayers) {
            if (!overlaps(player, box)) continue;

            const previousBottom = player.y + player.h - player.vy * dt;
            if (player.vy > 80 && previousBottom < box.y + 13) {
              enemy.alive = false;
              player.vy = -350;
            } else {
              loseLife();
            }
            break;
          }
        }

        if (activePlayers.some(player => player.y > viewHeight + 70)) {
          loseLife();
        }

        if (!running) return;
      }

      function drawBackground(theme, camera) {
        const gradient = ctx.createLinearGradient(0, 0, 0, viewHeight);
        gradient.addColorStop(0, theme.top);
        gradient.addColorStop(1, theme.bottom);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, viewWidth, viewHeight);

        for (let i = 0; i < 7; i++) {
          const x = i * 280 - (camera * 0.18 % 280);
          ctx.fillStyle = theme.hill;
          ctx.beginPath();
          ctx.ellipse(x + 110, groundY + 8, 150, 88, 0, Math.PI, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = "#ffffffdd";
        for (let i = 0; i < 5; i++) {
          const x = ((i * 220 - camera * 0.12) % (viewWidth + 240) + viewWidth + 240) % (viewWidth + 240) - 80;
          const y = 55 + (i % 3) * 38;
          ctx.beginPath();
          ctx.arc(x, y, 18, 0, Math.PI * 2);
          ctx.arc(x + 24, y - 9, 25, 0, Math.PI * 2);
          ctx.arc(x + 48, y, 18, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawPlayer(player, camera, label) {
        if (player.invulnerable > 0 && Math.floor(player.invulnerable * 12) % 2 === 0) return;

        const x = player.x - camera;
        const y = player.y;

        ctx.fillStyle = "#173d4d";
        ctx.fillRect(x + 4, y + 40, 11, 6);
        ctx.fillRect(x + 20, y + 40, 11, 6);

        ctx.fillStyle = "#f07a3d";
        ctx.fillRect(x + 6, y + 7, 23, 9);
        ctx.fillRect(x + 2, y + 13, 30, 5);

        ctx.fillStyle = "#f3bd8e";
        ctx.fillRect(x + 8, y + 15, 20, 17);

        ctx.fillStyle = "#293449";
        ctx.fillRect(x + 13, y + 21, 3, 4);
        ctx.fillRect(x + 22, y + 21, 3, 4);

        ctx.fillStyle = "#70443c";
        ctx.fillRect(x + 13, y + 28, 11, 3);

        ctx.fillStyle = player.shirt;
        ctx.fillRect(x + 5, y + 31, 25, 13);

        ctx.fillStyle = player.bag;
        ctx.fillRect(x + 26, y + 33, 8, 11);

        if (twoPlayers) {
          ctx.fillStyle = "white";
          ctx.font = "bold 10px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(label, x + player.w / 2, y - 3);
          ctx.textAlign = "left";
        }
      }

      function drawGround(start, end, theme, camera) {
        const x = start - camera;
        const w = end - start;
        if (x > viewWidth || x + w < 0) return;

        ctx.fillStyle = theme.grass;
        ctx.fillRect(x, groundY, w, 12);
        ctx.fillStyle = theme.dirt;
        ctx.fillRect(x, groundY + 12, w, viewHeight - groundY);
      }

      function drawWorldInView(player, playerNumber, xOffset, yOffset) {
        const camera = Math.max(0, Math.min(
          world().length - viewWidth,
          player.x + player.w / 2 - viewWidth / 2
        ));

        ctx.save();
        ctx.beginPath();
        ctx.rect(xOffset, yOffset, viewWidth, viewHeight);
        ctx.clip();
        ctx.translate(xOffset, yOffset);

        const theme = themes[worldIndex];
        drawBackground(theme, camera);

        let start = 0;
        for (const [gapStart, gapEnd] of world().gaps) {
          drawGround(start, gapStart, theme, camera);
          start = gapEnd;
        }
        drawGround(start, world().length, theme, camera);

        for (const [x, w, h] of world().platforms) {
          const px = x - camera;
          const py = groundY - h;
          ctx.fillStyle = theme.grass;
          ctx.fillRect(px, py, w, 10);
          ctx.fillStyle = theme.dirt;
          ctx.fillRect(px, py + 10, w, 7);
        }

        for (const coin of pickups) {
          if (coin.collected) continue;
          const cx = coin.x - camera;
          ctx.fillStyle = theme.coin;
          ctx.beginPath();
          ctx.ellipse(cx, coin.y, 9, 13, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff7c0";
          ctx.fillRect(cx - 2, coin.y - 7, 4, 14);
        }

        for (const enemy of enemies) {
          if (!enemy.alive) continue;
          const ex = enemy.x - camera;
          const ey = groundY - 30;
          ctx.fillStyle = "#8d5be8";
          ctx.fillRect(ex, ey + 5, 32, 25);
          ctx.fillStyle = "#f5bc57";
          ctx.fillRect(ex + 4, ey, 24, 8);

          ctx.fillStyle = "white";
          ctx.fillRect(ex + 7, ey + 12, 5, 5);
          ctx.fillRect(ex + 20, ey + 12, 5, 5);
          ctx.fillStyle = "#33234b";
          ctx.fillRect(ex + 9, ey + 13, 2, 4);
          ctx.fillRect(ex + 22, ey + 13, 2, 4);
        }

        const pipeX = world().pipeX - camera;
        const pipeY = groundY - 58;
        ctx.fillStyle = theme.pipe;
        ctx.fillRect(pipeX + 6, pipeY + 10, 48, 48);
        ctx.fillRect(pipeX, pipeY, 60, 18);
        ctx.fillStyle = "#ffffff55";
        ctx.fillRect(pipeX + 7, pipeY + 3, 8, 11);

        drawPlayer(player, camera, "P" + playerNumber);

        ctx.fillStyle = "#ffffffd9";
        ctx.font = "bold 13px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("PLAYER " + playerNumber, viewWidth / 2, 25);
        ctx.textAlign = "left";

        ctx.restore();
      }

      function draw() {
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        ctx.fillStyle = "#17213d";
        ctx.fillRect(0, 0, width, height);

        if (!twoPlayers) {
          viewWidth = width;
          viewHeight = height;
          groundY = height - (width < 600 ? 108 : 88);
          drawWorldInView(players[0], 1, 0, 0);
          return;
        }

        if (width > height * 1.15) {
          viewWidth = width / 2;
          viewHeight = height;
          groundY = height - 88;
          drawWorldInView(players[0], 1, 0, 0);
          drawWorldInView(players[1], 2, width / 2, 0);
          ctx.fillStyle = "#fff";
          ctx.fillRect(width / 2 - 2, 0, 4, height);
        } else {
          viewWidth = width;
          viewHeight = height / 2;
          groundY = viewHeight - 82;
          drawWorldInView(players[0], 1, 0, 0);
          drawWorldInView(players[1], 2, 0, height / 2);
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, height / 2 - 2, width, 4);
        }
      }

      function frame(now) {
        const dt = lastTime ? (now - lastTime) / 1000 : 0;
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function bindTouch(id, action) {
        const button = $(id);

        button.addEventListener("pointerdown", event => {
          event.preventDefault();

          if (action === "p1jump") jump(players[0]);
          else if (action === "p2jump") jump(players[1]);
          else if (action === "pipe") enterPipe();
          else keys[action] = true;

          if (button.setPointerCapture) button.setPointerCapture(event.pointerId);
        });

        const release = () => {
          if (action in keys) keys[action] = false;
        };

        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      }

      function toggleLanguage() {
        language = language === "en" ? "es" : "en";
        $("language").textContent = language === "en" ? "ES" : "EN";
        $("screen-language").textContent = language === "en" ? "ES" : "EN";
        $("menu-message").textContent = t("intro");
        $("menu-bottom").textContent = t("controls");
        $("mode-button").textContent = twoPlayers ? t("two") : t("one");
        $("music").textContent = musicEnabled ? "♫" : "♫×";
      }

      $("play").addEventListener("click", startGame);

      $("mode-button").addEventListener("click", () => {
        twoPlayers = !twoPlayers;
        $("mode-button").textContent = twoPlayers ? t("two") : t("one");
      });

      $("language").addEventListener("click", toggleLanguage);
      $("screen-language").addEventListener("click", toggleLanguage);

      $("music").addEventListener("click", () => {
        musicEnabled = !musicEnabled;
        $("music").textContent = musicEnabled ? "♫" : "♫×";
        if (musicEnabled && running) startMusic();
        else stopMusic();
      });

      bindTouch("p1left", "p1Left");
      bindTouch("p1right", "p1Right");
      bindTouch("p1jump", "p1jump");
      bindTouch("p2left", "p2Left");
      bindTouch("p2right", "p2Right");
      bindTouch("p2jump", "p2jump");
      bindTouch("pipe", "pipe");

      addEventListener("keydown", event => {
        const key = event.key.toLowerCase();

        if (["arrowleft","arrowright","arrowup","arrowdown"," "].includes(key)) {
          event.preventDefault();
        }

        if (key === "arrowleft") keys.p1Left = true;
        if (key === "arrowright") keys.p1Right = true;
        if (key === "arrowup" || key === " ") jump(players[0]);
        if (key === "arrowdown") enterPipe();

        if (twoPlayers) {
          if (key === "a") keys.p2Left = true;
          if (key === "d") keys.p2Right = true;
          if (key === "w") jump(players[1]);
          if (key === "s") enterPipe();
        }
      });

      addEventListener("keyup", event => {
        const key = event.key.toLowerCase();
        if (key === "arrowleft") keys.p1Left = false;
        if (key === "arrowright") keys.p1Right = false;
        if (key === "a") keys.p2Left = false;
        if (key === "d") keys.p2Right = false;
      });

      addEventListener("blur", () => {
        Object.keys(keys).forEach(k => keys[k] = false);
      });

      addEventListener("resize", resize);

      function initialize() {
        resize();
        setupWorld();
        updateMenu();
        requestAnimationFrame(frame);
      }

      initialize();
    })();
  </script>
</body>
</html>
