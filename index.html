<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Temu Bros</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: #75caff;
    color: white;
    font-family: system-ui, sans-serif;
    user-select: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  #hud {
    position: fixed;
    z-index: 2;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    right: 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
    pointer-events: none;
    text-shadow: 0 2px 4px #17213d;
  }

  .badge, .hud-button {
    border: 1px solid #ffffff80;
    border-radius: 13px;
    padding: 8px 10px;
    color: white;
    background: #17243cbd;
    font: 800 clamp(12px, 3.2vw, 16px) system-ui, sans-serif;
  }

  .hud-button {
    pointer-events: auto;
    cursor: pointer;
  }

  #controls {
    position: fixed;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: max(14px, env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 14px;
    pointer-events: none;
  }

  .button-group {
    display: flex;
    gap: 9px;
  }

  .control {
    width: clamp(54px, 15vw, 76px);
    height: clamp(54px, 15vw, 76px);
    border: 2px solid #ffffffc0;
    border-radius: 19px;
    color: white;
    background: #30346ddd;
    font-size: 27px;
    font-weight: 900;
    box-shadow: 0 5px 0 #161a4599;
    pointer-events: auto;
    touch-action: none;
  }

  #jump { background: #e95491ee; }
  #action { background: #31a777ee; font-size: 21px; }

  .control:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #161a4599;
  }

  #screen {
    position: fixed;
    z-index: 5;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    background: #11172c66;
  }

  #card {
    width: min(440px, 100%);
    padding: 25px 20px;
    border: 3px solid white;
    border-radius: 25px;
    background: linear-gradient(145deg, #fff8df, #ffe2ef);
    box-shadow: 0 18px 60px #10172a66;
    color: #242744;
    text-align: center;
  }

  #card h1 {
    margin: 0 0 12px;
    font-size: clamp(34px, 9vw, 52px);
    line-height: 1;
  }

  #card p {
    font-size: 16px;
    line-height: 1.45;
  }

  #play {
    border: 0;
    border-radius: 15px;
    padding: 14px 26px;
    color: white;
    background: linear-gradient(#ff9147, #e94e82);
    box-shadow: 0 5px 0 #ba3f68;
    font-size: 19px;
    font-weight: 900;
    cursor: pointer;
  }

  #note {
    margin-bottom: 0;
    color: #65677a;
    font-size: 12px !important;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game" aria-label="Super Temu Bros game"></canvas>

<div id="hud">
  <div class="badge">
    🪙 <span id="coins">0</span>
    &nbsp; 💛 <span id="lives">3</span>
  </div>
  <div class="badge" id="levelLabel">Level 1</div>
  <button class="hud-button" id="language" aria-label="Change language">ES</button>
  <button class="hud-button" id="music" aria-label="Toggle music">♫</button>
</div>

<div id="controls">
  <div class="button-group">
    <button class="control" id="left" aria-label="Move left">◀</button>
    <button class="control" id="right" aria-label="Move right">▶</button>
  </div>
  <div class="button-group">
    <button class="control" id="action" aria-label="Enter pipe">⬇</button>
    <button class="control" id="jump" aria-label="Jump">⬆</button>
  </div>
</div>

<div id="screen">
  <div id="card">
    <h1 id="title">🛍️ Super Temu Bros</h1>
    <p id="description">
      Run, jump, collect coins, dodge grumpy parcels, and explore three worlds!
    </p>
    <button id="play">Start playing!</button>
    <p id="note">An original fan-made platform game with original art and music.</p>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);

  let width = innerWidth;
  let height = innerHeight;
  let pixelRatio = 1;
  let groundY = height - 100;
  let cameraX = 0;
  let lastFrameTime = 0;
  let language = "en";
  let running = false;
  let coins = 0;
  let lives = 3;
  let levelIndex = 0;

  const keys = { left: false, right: false };
  const player = {
    x: 60, y: 0, width: 36, height: 48,
    vx: 0, vy: 0, grounded: false, invulnerable: 0
  };

  let audioContext = null;
  let musicTimer = null;
  let musicEnabled = true;
  let musicNote = 0;
  let pickups = [];
  let enemies = [];

  const translations = {
    en: {
      intro: "Run, jump, collect coins, dodge grumpy parcels, and explore three worlds!",
      start: "Start playing!",
      again: "Play again",
      failTitle: "📦 Oops!",
      winTitle: "🏆 You did it!",
      fail: "You ran out of lives. Ready for another try?",
      win: "You conquered all three worlds. What a legendary shopping trip!",
      levels: ["Sunny Sale Hills", "Bubblewrap Bay", "Midnight Market"],
      level: n => `Level ${n + 1} · ${translations.en.levels[n]}`,
      musicOn: "♫",
      musicOff: "♫×"
    },
    es: {
      intro: "¡Corre, salta, recoge monedas, esquiva paquetes gruñones y explora tres mundos!",
      start: "¡A jugar!",
      again: "Jugar de nuevo",
      failTitle: "📦 ¡Ups!",
      winTitle: "🏆 ¡Lo lograste!",
      fail: "Te quedaste sin vidas. ¿Listo para intentarlo otra vez?",
      win: "Conquistaste los tres mundos. ¡Qué viaje de compras legendario!",
      levels: ["Colinas de ofertas", "Bahía de burbujas", "Mercado nocturno"],
      level: n => `Nivel ${n + 1} · ${translations.es.levels[n]}`,
      musicOn: "♫",
      musicOff: "♫×"
    }
  };

  const themes = [
    { skyTop: "#5dc8ff", skyBottom: "#d6f7ff", hill: "#65c88b", ground: "#986044", grass: "#44bd72", pipe: "#2cb75d", coin: "#ffe27a" },
    { skyTop: "#51b8d5", skyBottom: "#c8f4ec", hill: "#47aa9b", ground: "#8b5949", grass: "#42b89c", pipe: "#287f8e", coin: "#ffdc73" },
    { skyTop: "#343b77", skyBottom: "#a8a2e8", hill: "#5555a0", ground: "#634c72", grass: "#6fbe86", pipe: "#59a86a", coin: "#fff0a0" }
  ];

  // Each platform/coin height is measured upward from the ground.
  const levels = [
    {
      length: 2050,
      gaps: [[440, 535], [900, 1000], [1435, 1540]],
      ledges: [[250, 105, 78], [690, 115, 92], [1100, 110, 80], [1600, 120, 95]],
      coins: [[295, 140], [385, 68], [735, 160], [850, 70], [1140, 145], [1370, 70], [1640, 165], [1810, 75]],
      enemies: [[600, 535, 645, 65], [1030, 990, 1130, 75], [1535, 1490, 1635, 85], [1790, 1750, 1885, 90]],
      pipeX: 1930
    },
    {
      length: 2250,
      gaps: [[390, 485], [850, 950], [1320, 1425], [1770, 1870]],
      ledges: [[220, 115, 85], [575, 100, 75], [1000, 120, 90], [1485, 105, 78], [1920, 115, 85]],
      coins: [[260, 165], [350, 75], [615, 145], [800, 75], [1040, 165], [1260, 75], [1520, 150], [1715, 75], [1955, 160], [2110, 75]],
      enemies: [[520, 480, 620, 75], [960, 950, 1060, 80], [1435, 1425, 1535, 90], [1880, 1870, 1970, 95]],
      pipeX: 2130
    },
    {
      length: 2450,
      gaps: [[460, 565], [960, 1065], [1510, 1615], [2020, 2120]],
      ledges: [[260, 105, 78], [680, 120, 90], [1130, 110, 82], [1690, 125, 95], [2180, 110, 82]],
      coins: [[300, 150], [420, 70], [715, 170], [900, 75], [1165, 155], [1450, 75], [1735, 180], [1950, 75], [2220, 165], [2350, 75]],
      enemies: [[590, 565, 675, 80], [1080, 1065, 1175, 85], [1630, 1615, 1725, 90], [2130, 2120, 2230, 100]],
      pipeX: 2330
    }
  ];

  function t(key, ...args) {
    const value = translations[language][key];
    return typeof value === "function" ? value(...args) : value;
  }

  function currentLevel() {
    return levels[levelIndex];
  }

  function setCanvasSize() {
    width = innerWidth;
    height = innerHeight;
    pixelRatio = Math.min(devicePixelRatio || 1, 2);

    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

    groundY = height - (width < 600 ? 108 : 88);

    // Recalculate pickup positions on resize without resetting collected coins.
    for (const pickup of pickups) {
      pickup.y = groundY - pickup.height;
    }

    if (!running) {
      player.y = groundY - player.height;
    }

    updateLevelLabel();
  }

  function updateLevelLabel(nearPipe = false) {
    $("levelLabel").textContent =
      t("level", levelIndex) + (nearPipe ? " · ⬇" : "");
  }

  function updateHud() {
    $("coins").textContent = coins;
    $("lives").textContent = lives;
    updateLevelLabel();
  }

  function prepareLevel() {
    const level = currentLevel();

    pickups = level.coins.map(([x, height]) => ({
      x,
      height,
      y: groundY - height,
      collected: false
    }));

    enemies = level.enemies.map(([x, min, max, speed]) => ({
      x, min, max, speed, direction: 1, alive: true
    }));

    player.x = 60;
    player.y = groundY - player.height;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.invulnerable = 0;
    cameraX = 0;
    updateHud();
  }

  function startGame() {
    coins = 0;
    lives = 3;
    levelIndex = 0;
    prepareLevel();
    running = true;
    $("screen").classList.add("hidden");
    startMusic();
    lastFrameTime = performance.now();
  }

  function finishGame(won) {
    running = false;
    stopMusic();

    $("title").textContent = won ? t("winTitle") : t("failTitle");
    $("description").textContent = won ? t("win") : t("fail");
    $("play").textContent = t("again");
    $("screen").classList.remove("hidden");
  }

  function startMusic() {
    if (!musicEnabled) return;

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;

    audioContext ||= new AudioContextClass();
    audioContext.resume();
    clearInterval(musicTimer);

    // Original short chiptune phrase.
    const notes = [523, 659, 784, 659, 587, 698, 880, 698, 523, 659, 784, 988, 880, 784, 659, 587];

    musicTimer = setInterval(() => {
      if (!running || !musicEnabled || !audioContext) return;

      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "square";
      oscillator.frequency.value = notes[musicNote++ % notes.length];
      gain.gain.setValueAtTime(0.022, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.14);
    }, 175);
  }

  function stopMusic() {
    clearInterval(musicTimer);
  }

  function jump() {
    if (running && player.grounded) {
      player.vy = -680;
      player.grounded = false;
    }
  }

  function enterPipe() {
    if (!running || !player.grounded) return;

    const distance = Math.abs((player.x + player.width / 2) - currentLevel().pipeX);
    if (distance > 68) return;

    if (levelIndex < levels.length - 1) {
      levelIndex++;
      prepareLevel();
    } else {
      finishGame(true);
    }
  }

  function intersects(a, b) {
    return a.x < b.x + b.width &&
      a.x + a.width > b.x &&
      a.y < b.y + b.height &&
      a.y + a.height > b.y;
  }

  function loseLife() {
    if (!running || player.invulnerable > 0) return;

    lives--;
    updateHud();

    if (lives <= 0) {
      finishGame(false);
      return;
    }

    // Respawn at this level's start and briefly protect the player.
    player.x = 60;
    player.y = groundY - player.height - 4;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.invulnerable = 1.5;
    cameraX = 0;
  }

  function groundSupportsPlayer() {
    const center = player.x + player.width / 2;
    return !currentLevel().gaps.some(([start, end]) => center > start && center < end);
  }

  function update(deltaTime) {
    if (!running) return;

    const dt = Math.min(deltaTime, 0.033);
    const level = currentLevel();

    player.invulnerable = Math.max(0, player.invulnerable - dt);

    player.vx = ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * 300;
    player.x = Math.max(
      0,
      Math.min(level.length - player.width, player.x + player.vx * dt)
    );

    const previousBottom = player.y + player.height;
    player.vy += 1750 * dt;
    player.y += player.vy * dt;
    player.grounded = false;

    // Land on the ground only when the player is not over a gap.
    if (
      groundSupportsPlayer() &&
      player.vy >= 0 &&
      previousBottom <= groundY + 2 &&
      player.y + player.height >= groundY
    ) {
      player.y = groundY - player.height;
      player.vy = 0;
      player.grounded = true;
    }

    // Land on the level's raised platforms.
    for (const [x, platformWidth, platformHeight] of level.ledges) {
      const platformY = groundY - platformHeight;
      const overlapsX =
        player.x + player.width > x &&
        player.x < x + platformWidth;

      if (
        overlapsX &&
        player.vy >= 0 &&
        previousBottom <= platformY + 3 &&
        player.y + player.height >= platformY
      ) {
        player.y = platformY - player.height;
        player.vy = 0;
        player.grounded = true;
      }
    }

    for (const pickup of pickups) {
      if (pickup.collected) continue;

      const coinBox = {
        x: pickup.x - 11,
        y: pickup.y - 12,
        width: 22,
        height: 24
      };

      if (intersects(player, coinBox)) {
        pickup.collected = true;
        coins++;
        updateHud();
      }
    }

    for (const enemy of enemies) {
      if (!enemy.alive) continue;

      enemy.x += enemy.direction * enemy.speed * dt;
      if (enemy.x < enemy.min || enemy.x > enemy.max) {
        enemy.direction *= -1;
        enemy.x = Math.max(enemy.min, Math.min(enemy.max, enemy.x));
      }

      const enemyBox = {
        x: enemy.x,
        y: groundY - 31,
        width: 34,
        height: 31
      };

      if (!intersects(player, enemyBox)) continue;

      // Jump on top of a parcel to defeat it; otherwise lose a life.
      if (player.vy > 100 && previousBottom <= enemyBox.y + 14) {
        enemy.alive = false;
        player.vy = -390;
      } else {
        loseLife();
      }
      break;
    }

    // Check once, then respawn; avoid repeatedly subtracting lives while falling.
    if (player.y > height + 80) {
      loseLife();
    }

    if (!running) return;

    const nearPipe =
      player.grounded &&
      Math.abs((player.x + player.width / 2) - level.pipeX) < 90;

    updateLevelLabel(nearPipe);
    cameraX = Math.max(0, Math.min(level.length - width, player.x - width * 0.36));
  }

  function drawBackground(theme) {
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, theme.skyTop);
    gradient.addColorStop(1, theme.skyBottom);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < 9; i++) {
      const x = i * 310 - (cameraX * 0.18 % 310);
      ctx.fillStyle = theme.hill;
      ctx.beginPath();
      ctx.ellipse(x + 130, groundY + 8, 170, 95, 0, Math.PI, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "#ffffffdd";
    for (let i = 0; i < 7; i++) {
      const x = ((i * 270 - cameraX * 0.12) % (width + 280) + width + 280) % (width + 280) - 100;
      const y = 76 + (i % 3) * 48;
      ctx.beginPath();
      ctx.arc(x, y, 23, 0, Math.PI * 2);
      ctx.arc(x + 29, y - 12, 31, 0, Math.PI * 2);
      ctx.arc(x + 60, y, 23, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround(start, end, theme) {
    const x = start - cameraX;
    const groundWidth = end - start;

    if (x > width || x + groundWidth < 0) return;

    ctx.fillStyle = theme.grass;
    ctx.fillRect(x, groundY, groundWidth, 14);
    ctx.fillStyle = theme.ground;
    ctx.fillRect(x, groundY + 14, groundWidth, height - groundY);

    ctx.fillStyle = "#ffffff20";
    for (let tileX = x + 18; tileX < x + groundWidth; tileX += 58) {
      ctx.fillRect(tileX, groundY + 36, 27, 4);
    }
  }

  function drawPipe(x, theme, active) {
    const screenX = x - cameraX;
    const y = groundY - 62;

    ctx.fillStyle = theme.pipe;
    ctx.fillRect(screenX + 7, y + 10, 52, 52);
    ctx.fillRect(screenX, y, 66, 19);
    ctx.fillStyle = "#ffffff45";
    ctx.fillRect(screenX + 7, y + 3, 10, 12);
    ctx.fillStyle = "#00000020";
    ctx.fillRect(screenX + 54, y + 4, 8, 55);

    if (active) {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 15px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("⬇", screenX + 33, y - 8);
      ctx.textAlign = "left";
    }
  }

  function drawPlayer() {
    if (player.invulnerable > 0 && Math.floor(player.invulnerable * 12) % 2 === 0) {
      return;
    }

    const x = player.x - cameraX;
    const y = player.y;

    // Original delivery-runner character.
    ctx.fillStyle = "#173d4d";
    ctx.fillRect(x + 5, y + 42, 12, 6);
    ctx.fillRect(x + 21, y + 42, 12, 6);

    ctx.fillStyle = "#f07a3d";
    ctx.fillRect(x + 6, y + 8, 25, 9);
    ctx.fillRect(x + 2, y + 14, 32, 5);

    ctx.fillStyle = "#f3bd8e";
    ctx.fillRect(x + 8, y + 16, 22, 18);

    ctx.fillStyle = "#293449";
    ctx.fillRect(x + 14, y + 22, 3, 4);
    ctx.fillRect(x + 24, y + 22, 3, 4);

    ctx.fillStyle = "#70443c";
    ctx.fillRect(x + 14, y + 29, 12, 3);

    ctx.fillStyle = "#138b91";
    ctx.fillRect(x + 5, y + 33, 27, 13);

    ctx.fillStyle = "#ffd451";
    ctx.fillRect(x + 27, y + 34, 9, 12);
    ctx.fillStyle = "#fff0a3";
    ctx.fillRect(x + 29, y + 36, 5, 3);

    ctx.fillStyle = "#f3bd8e";
    ctx.fillRect(x + 1, y + 34, 6, 11);
  }

  function drawEnemy(enemy) {
    if (!enemy.alive) return;

    const x = enemy.x - cameraX;
    const y = groundY - 31;

    ctx.fillStyle = "#8d5be8";
    ctx.fillRect(x, y + 5, 34, 26);

    ctx.fillStyle = "#f5bc57";
    ctx.fillRect(x + 5, y, 24, 8);

    ctx.fillStyle = "#fff";
    ctx.fillRect(x + 7, y + 12, 6, 6);
    ctx.fillRect(x + 21, y + 12, 6, 6);

    ctx.fillStyle = "#33234b";
    ctx.fillRect(x + 9, y + 14, 3, 4);
    ctx.fillRect(x + 23, y + 14, 3, 4);

    ctx.fillStyle = "#7043bf";
    ctx.fillRect(x + 3, y + 29, 11, 4);
    ctx.fillRect(x + 21, y + 29, 11, 4);
  }

  function draw() {
    const theme = themes[levelIndex];
    const level = currentLevel();

    drawBackground(theme);

    let groundStart = 0;
    for (const [gapStart, gapEnd] of level.gaps) {
      drawGround(groundStart, gapStart, theme);
      groundStart = gapEnd;
    }
    drawGround(groundStart, level.length, theme);

    for (const [x, platformWidth, platformHeight] of level.ledges) {
      const screenX = x - cameraX;
      const y = groundY - platformHeight;

      ctx.fillStyle = theme.grass;
      ctx.fillRect(screenX, y, platformWidth, 11);
      ctx.fillStyle = theme.ground;
      ctx.fillRect(screenX, y + 11, platformWidth, 8);
      ctx.fillStyle = "#ffffff55";
      ctx.fillRect(screenX + 5, y + 3, platformWidth - 10, 3);
    }

    for (const pickup of pickups) {
      if (pickup.collected) continue;

      const x = pickup.x - cameraX;
      ctx.fillStyle = theme.coin;
      ctx.beginPath();
      ctx.ellipse(x, pickup.y, 10, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff7c0";
      ctx.fillRect(x - 2, pickup.y - 8, 4, 16);
    }

    for (const enemy of enemies) drawEnemy(enemy);

    const playerNearPipe =
      player.grounded &&
      Math.abs((player.x + player.width / 2) - level.pipeX) < 90;

    drawPipe(level.pipeX, theme, playerNearPipe);
    drawPlayer();
  }

  function frame(now) {
    const deltaTime = lastFrameTime ? (now - lastFrameTime) / 1000 : 0;
    lastFrameTime = now;
    update(deltaTime);
    draw();
    requestAnimationFrame(frame);
  }

  function bindControl(id, action) {
    const button = $(id);

    button.addEventListener("pointerdown", event => {
      event.preventDefault();

      if (action === "jump") jump();
      else if (action === "pipe") enterPipe();
      else keys[action] = true;

      if (button.setPointerCapture) button.setPointerCapture(event.pointerId);
    });

    const release = () => {
      if (action === "left" || action === "right") keys[action] = false;
    };

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
  }

  $("play").addEventListener("click", startGame);

  $("language").addEventListener("click", () => {
    language = language === "en" ? "es" : "en";
    $("language").textContent = language === "en" ? "ES" : "EN";
    $("description").textContent = t("intro");
    $("play").textContent = running ? t("start") : t("start");
    updateLevelLabel();
  });

  $("music").addEventListener("click", () => {
    musicEnabled = !musicEnabled;
    $("music").textContent = musicEnabled ? t("musicOn") : t("musicOff");
    if (musicEnabled) startMusic();
    else stopMusic();
  });

  bindControl("left", "left");
  bindControl("right", "right");
  bindControl("jump", "jump");
  bindControl("action", "pipe");

  addEventListener("keydown", event => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(event.key)) {
      event.preventDefault();
    }

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") keys.left = true;
    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") keys.right = true;
    if (event.key === "ArrowUp" || event.key === " ") jump();
    if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") enterPipe();
  });

  addEventListener("keyup", event => {
    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") keys.left = false;
    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") keys.right = false;
  });

  addEventListener("blur", () => {
    keys.left = false;
    keys.right = false;
  });

  setCanvasSize();
  prepareLevel();
  $("description").textContent = t("intro");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
