<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Temu Bros</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;user-select:none}body{background:#617de8;color:#fff;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:fixed;z-index:2;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:5px;pointer-events:none;text-shadow:0 2px 4px #17213d}.badge,.hud-button{padding:7px 9px;border:2px solid #ffffffa8;border-radius:8px;color:white;background:rgba(23,36,60,.75);font:800 clamp(10px,2.8vw,15px) system-ui,sans-serif}.hud-button{pointer-events:auto;cursor:pointer}
#controls{position:fixed;z-index:3;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:end;justify-content:space-between;gap:6px;padding:0 8px;pointer-events:none}.control-group{display:flex;align-items:center;gap:clamp(3px,1vw,8px);pointer-events:none}.control-group button,.pipe-button{pointer-events:auto}.control-group span{font-size:10px;font-weight:900;text-shadow:0 1px 3px #111}.control{width:clamp(40px,10.5vw,66px);height:clamp(46px,12vw,66px);padding:0;border:2px solid #ffffffc0;border-radius:12px;color:#fff;background:#30346ddd;font-size:clamp(18px,5vw,26px);font-weight:900;box-shadow:0 4px 0 #161a4599;touch-action:none}.jump-button{background:#e95491ee}.pipe-button{background:#31a777ee;font-size:19px;pointer-events:auto}.control:active{transform:translateY(3px);box-shadow:0 1px 0 #161a4599}
body.single-player #p2Controls{display:none}body.single-player #controls{justify-content:flex-start}body.single-player #controls .control-group:first-child{margin-right:auto}body.single-player #pipe{margin-left:auto}
#screen{position:fixed;z-index:5;inset:0;display:grid;place-items:center;overflow:auto;padding:20px;background:#617de8}#screen:before{content:"";position:absolute;inset:0;opacity:.22;background-image:linear-gradient(90deg,transparent 96%,#fff 96%),linear-gradient(transparent 96%,#fff 96%);background-size:24px 24px;pointer-events:none}#menu{position:relative;width:min(600px,100%);padding:18px;text-align:center;font-family:"Courier New",monospace}.scoreline{display:flex;justify-content:space-between;gap:6px;margin:0 auto 12px;max-width:520px;font-size:clamp(11px,3vw,17px);font-weight:900;text-shadow:2px 2px #293675}#title-plaque{width:min(520px,100%);margin:0 auto 18px;padding:clamp(18px,5vw,34px) 10px;border:7px solid #793416;outline:4px solid #f7bd83;background:#df531d;box-shadow:0 8px 0 #57283a,inset 0 0 0 4px #ff9a55;color:#fff0d4;text-shadow:4px 5px 0 #712d28}#title-plaque h1{margin:0;font-size:clamp(34px,10vw,70px);line-height:.95;letter-spacing:-4px}#title-plaque .subtitle{display:block;margin-top:12px;font-size:clamp(12px,3.5vw,22px);font-weight:900;letter-spacing:2px}#menu-message{min-height:46px;margin:12px auto;max-width:470px;font:700 clamp(14px,3.5vw,18px)/1.4 system-ui,sans-serif}.menu-button{display:block;width:min(350px,100%);margin:10px auto;padding:12px;border:3px solid #fff2c6;border-radius:4px;color:white;background:#287e42;box-shadow:0 5px 0 #174b35;font:900 clamp(15px,4vw,21px) "Courier New",monospace;cursor:pointer}#mode-button{background:#354a9a;box-shadow:0 5px 0 #233266}#menu-bottom{margin-top:15px;font:700 12px system-ui,sans-serif}#screen-language{position:absolute;top:8px;right:8px;z-index:1;padding:8px 12px;border:2px solid white;border-radius:5px;color:white;background:#293675;font-weight:900}.hidden{display:none!important}@media(max-height:500px){#menu{padding:6px}#title-plaque{margin-bottom:10px;padding:12px 8px}#menu-message{min-height:30px;margin:7px auto}#menu-bottom{margin-top:7px}}
</style>
</head>
<body class="single-player">
<canvas id="game" aria-label="Super Temu Bros game"></canvas>
<div id="hud"><div class="badge">🪙 <span id="coins">0</span> · 💛 <span id="lives">3</span></div><div class="badge" id="levelLabel">WORLD 1-1</div><button class="hud-button" id="language">ES</button><button class="hud-button" id="music">♫</button></div>
<div id="controls">
  <div class="control-group" id="p1Controls"><span>P1</span><button class="control" id="p1left" aria-label="Player 1 left">◀</button><button class="control" id="p1right" aria-label="Player 1 right">▶</button><button class="control jump-button" id="p1jump" aria-label="Player 1 jump">⬆</button></div>
  <button class="control pipe-button" id="pipe" aria-label="Enter pipe">⬇</button>
  <div class="control-group" id="p2Controls"><span>P2</span><button class="control" id="p2left" aria-label="Player 2 left">◀</button><button class="control" id="p2right" aria-label="Player 2 right">▶</button><button class="control jump-button" id="p2jump" aria-label="Player 2 jump">⬆</button></div>
</div>
<div id="screen"><button id="screen-language">ES</button><main id="menu"><div class="scoreline"><span id="menu-coins">COINS 000</span><span id="menu-world">WORLD 1-1</span><span>READY!</span></div><div id="title-plaque"><h1>SUPER<br>TEMU BROS</h1><span class="subtitle">BARGAIN KINGDOM ADVENTURE</span></div><p id="menu-message"></p><button class="menu-button" id="mode-button">👤 1 PLAYER</button><button class="menu-button" id="play">▶ START GAME</button><div id="menu-bottom"></div></main></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
let width=innerWidth,height=innerHeight,dpr=1,viewW=width,viewH=height,groundY=height-90,running=false,twoPlayers=false,language='en',coins=0,lives=3,worldIndex=0,lastTime=0,pickups=[],enemies=[],audio=null,musicTimer=null,musicOn=true,noteIndex=0;
const keys={p1Left:false,p1Right:false,p2Left:false,p2Right:false};
const players=[{x:55,y:0,w:34,h:46,vx:0,vy:0,grounded:false,invuln:0,shirt:'#138b91',bag:'#ffd451'},{x:55,y:0,w:34,h:46,vx:0,vy:0,grounded:false,invuln:0,shirt:'#7355b8',bag:'#69df94'}];
const words={en:{intro:'Six worlds! Play solo or team up. In 2-player mode, each player gets their own view.',one:'👤 1 PLAYER',two:'👥 2 PLAYERS',start:'▶ START GAME',again:'▶ PLAY AGAIN',fail:'Game over! Ready for another try?',win:'You conquered all six worlds!',controls:'P1: ARROWS · P2: WASD · JUMP: UP / W · PIPE: DOWN / S'},es:{intro:'¡Seis mundos! Juega solo o en equipo. En modo de 2 jugadores, cada uno tiene su propia vista.',one:'👤 1 JUGADOR',two:'👥 2 JUGADORES',start:'▶ EMPEZAR',again:'▶ JUGAR DE NUEVO',fail:'¡Fin del juego! ¿Quieres intentarlo otra vez?',win:'¡Conquistaste los seis mundos!',controls:'P1: FLECHAS · P2: WASD · SALTAR: ↑ / W · TUBERÍA: ↓ / S'}};
const themes=[['#5dc8ff','#d6f7ff','#65c88b','#986044','#44bd72','#2cb75d','#ffe27a'],['#51b8d5','#c8f4ec','#47aa9b','#8b5949','#42b89c','#287f8e','#ffdc73'],['#e89758','#ffe1a2','#bb704d','#765044','#c78c53','#468c65','#fff08a'],['#5ab78d','#c9f0a2','#3f9467','#705642','#57b95e','#32834d','#ffe46f'],['#343b77','#a8a2e8','#5555a0','#634c72','#6fbe86','#59a86a','#fff0a0'],['#f19068','#ffe5a7','#d6a64c','#916047','#71bd66','#40975b','#fff37a']];
function buildWorlds(){return themes.map((_,n)=>{let length=2200+n*240,gaps=[],platforms=[],coinList=[],enemyList=[];for(let i=0;i<3+Math.floor(n/2);i++){let a=410+i*440,b=a+90+n*5;gaps.push([a,b]);platforms.push([a-145,110,82+(n%3)*7]);coinList.push([a-105,145],[b+55,70]);let ex=b+140;if(ex<length-190)enemyList.push([ex,ex-40,ex+65,55+n*8]);}for(let i=0;i<3;i++){let x=245+i*600+n*20;if(x+130<length-180){let h=105+((i+n)%3)*10;platforms.push([x,115,h]);coinList.push([x+50,h+45]);}}return{length,gaps,platforms,coins:coinList,enemies:enemyList,pipeX:length-95};});}
const worlds=buildWorlds(),t=k=>words[language][k],world=()=>worlds[worldIndex],label=()=>`WORLD ${worldIndex+1}-1`;
function setView(){if(!twoPlayers){viewW=width;viewH=height;}else if(width>height*1.15){viewW=width/2;viewH=height;}else{viewW=width;viewH=height/2;}groundY=viewH-(viewW<430?82:94);}
function resize(){width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';setView();pickups.forEach(c=>c.y=groundY-c.h);if(!running)players.forEach(p=>p.y=groundY-p.h);hud();}
function hud(){$('coins').textContent=coins;$('lives').textContent=lives;$('levelLabel').textContent=label();$('menu-world').textContent=label();$('menu-coins').textContent=`COINS ${String(coins).padStart(3,'0')}`;}
function menu(){document.body.classList.toggle('single-player',!twoPlayers);$('menu-message').textContent=t('intro');$('menu-bottom').textContent=t('controls');$('mode-button').textContent=twoPlayers?t('two'):t('one');$('play').textContent=t('start');hud();}
function setupWorld(){const w=world();pickups=w.coins.map(([x,h])=>({x,h,y:groundY-h,got:false}));enemies=w.enemies.map(([x,min,max,speed])=>({x,min,max,speed,dir:1,alive:true}));players.forEach((p,i)=>{p.x=55+i*45;p.y=groundY-p.h;p.vx=p.vy=0;p.grounded=false;p.invuln=0;});hud();}
function start(){coins=0;lives=3;worldIndex=0;setView();setupWorld();running=true;$('screen').classList.add('hidden');music();lastTime=performance.now();}
function finish(win){running=false;stopMusic();$('title-plaque').innerHTML=win?'<h1>WORLD<br>COMPLETE!</h1><span class="subtitle">SUPER TEMU BROS</span>':'<h1>GAME<br>OVER</h1><span class="subtitle">SUPER TEMU BROS</span>';$('menu-message').textContent=win?t('win'):t('fail');$('play').textContent=t('again');$('screen').classList.remove('hidden');}
function music(){if(!musicOn)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio||=new AC();audio.resume();clearInterval(musicTimer);const notes=[523,659,784,659,587,698,880,698,523,659,784,988,880,784,659,587];musicTimer=setInterval(()=>{if(!running||!musicOn)return;let now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=notes[noteIndex++%notes.length];g.gain.setValueAtTime(.02,now);g.gain.exponentialRampToValueAtTime(.001,now+.13);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.14);},175);}
function stopMusic(){clearInterval(musicTimer);}
function jump(p){if(running&&p.grounded){p.vy=-640;p.grounded=false;}}
function enterPipe(){if(!running)return;let team=twoPlayers?players:[players[0]];if(!team.every(p=>p.grounded&&Math.abs(p.x+p.w/2-world().pipeX)<75))return;if(worldIndex<worlds.length-1){worldIndex++;setupWorld();}else finish(true);}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hurt(){if(!running||players.some(p=>p.invuln>0))return;lives--;if(lives<=0){hud();finish(false);return;}players.forEach((p,i)=>{p.x=55+i*45;p.y=groundY-p.h-3;p.vx=p.vy=0;p.grounded=false;p.invuln=1.5;});hud();}
function overGap(p){let c=p.x+p.w/2;return world().gaps.some(([a,b])=>c>a&&c<b);}
function updatePlayer(p,left,right,dt){p.invuln=Math.max(0,p.invuln-dt);p.vx=((right?1:0)-(left?1:0))*270;p.x=Math.max(0,Math.min(world().length-p.w,p.x+p.vx*dt));let old=p.y+p.h;p.vy+=1650*dt;p.y+=p.vy*dt;p.grounded=false;if(!overGap(p)&&p.vy>=0&&old<=groundY+2&&p.y+p.h>=groundY){p.y=groundY-p.h;p.vy=0;p.grounded=true;}for(const [x,w,h] of world().platforms){let py=groundY-h;if(p.x+p.w>x&&p.x<x+w&&p.vy>=0&&old<=py+3&&p.y+p.h>=py){p.y=py-p.h;p.vy=0;p.grounded=true;}}}
function update(dt){if(!running)return;dt=Math.min(dt,.033);updatePlayer(players[0],keys.p1Left,keys.p1Right,dt);if(twoPlayers)updatePlayer(players[1],keys.p2Left,keys.p2Right,dt);let team=twoPlayers?players:[players[0]];for(const c of pickups){if(!c.got&&team.some(p=>hit(p,{x:c.x-10,y:c.y-12,w:20,h:24}))){c.got=true;coins++;hud();}}for(const e of enemies){if(!e.alive)continue;e.x+=e.dir*e.speed*dt;if(e.x<e.min||e.x>e.max){e.dir*=-1;e.x=Math.max(e.min,Math.min(e.max,e.x));}let box={x:e.x,y:groundY-30,w:32,h:30};for(const p of team){if(!hit(p,box))continue;let prev=p.y+p.h-p.vy*dt;if(p.vy>80&&prev<box.y+13){e.alive=false;p.vy=-350;}else hurt();break;}}if(team.some(p=>p.y>viewH+70))hurt();hud();}
function background(theme,camera){let g=ctx.createLinearGradient(0,0,0,viewH);g.addColorStop(0,theme[0]);g.addColorStop(1,theme[1]);ctx.fillStyle=g;ctx.fillRect(0,0,viewW,viewH);for(let i=0;i<7;i++){let x=i*280-(camera*.18%280);ctx.fillStyle=theme[2];ctx.beginPath();ctx.ellipse(x+110,groundY+8,150,88,0,Math.PI,Math.PI*2);ctx.fill();}ctx.fillStyle='#ffffffdd';for(let i=0;i<5;i++){let x=((i*220-camera*.12)%(viewW+240)+viewW+240)%(viewW+240)-80,y=55+i%3*38;ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.arc(x+24,y-9,25,0,Math.PI*2);ctx.arc(x+48,y,18,0,Math.PI*2);ctx.fill();}}
function ground(a,b,theme,camera){let x=a-camera,w=b-a;if(x>viewW||x+w<0)return;ctx.fillStyle=theme[4];ctx.fillRect(x,groundY,w,12);ctx.fillStyle=theme[3];ctx.fillRect(x,groundY+12,w,viewH-groundY);}
function drawPlayer(p,camera,n){if(p.invuln>0&&Math.floor(p.invuln*12)%2===0)return;let x=p.x-camera,y=p.y;ctx.fillStyle='#173d4d';ctx.fillRect(x+4,y+40,11,6);ctx.fillRect(x+20,y+40,11,6);ctx.fillStyle='#f07a3d';ctx.fillRect(x+6,y+7,23,9);ctx.fillRect(x+2,y+13,30,5);ctx.fillStyle='#f3bd8e';ctx.fillRect(x+8,y+15,20,17);ctx.fillStyle='#293449';ctx.fillRect(x+13,y+21,3,4);ctx.fillRect(x+22,y+21,3,4);ctx.fillStyle='#70443c';ctx.fillRect(x+13,y+28,11,3);ctx.fillStyle=p.shirt;ctx.fillRect(x+5,y+31,25,13);ctx.fillStyle=p.bag;ctx.fillRect(x+26,y+33,8,11);if(twoPlayers){ctx.fillStyle='white';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('P'+n,x+p.w/2,y-3);ctx.textAlign='left';}}
function drawView(p,n,ox,oy){let camera=Math.max(0,Math.min(world().length-viewW,p.x+p.w/2-viewW/2));ctx.save();ctx.beginPath();ctx.rect(ox,oy,viewW,viewH);ctx.clip();ctx.translate(ox,oy);let th=themes[worldIndex];background(th,camera);let start=0;for(const [a,b] of world().gaps){ground(start,a,th,camera);start=b;}ground(start,world().length,th,camera);for(const [x,w,h] of world().platforms){let px=x-camera,py=groundY-h;ctx.fillStyle=th[4];ctx.fillRect(px,py,w,10);ctx.fillStyle=th[3];ctx.fillRect(px,py+10,w,7);}for(const c of pickups){if(c.got)continue;let x=c.x-camera;ctx.fillStyle=th[6];ctx.beginPath();ctx.ellipse(x,c.y,9,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7c0';ctx.fillRect(x-2,c.y-7,4,14);}for(const e of enemies){if(!e.alive)continue;let x=e.x-camera,y=groundY-30;ctx.fillStyle='#8d5be8';ctx.fillRect(x,y+5,32,25);ctx.fillStyle='#f5bc57';ctx.fillRect(x+4,y,24,8);ctx.fillStyle='white';ctx.fillRect(x+7,y+12,5,5);ctx.fillRect(x+20,y+12,5,5);ctx.fillStyle='#33234b';ctx.fillRect(x+9,y+13,2,4);ctx.fillRect(x+22,y+13,2,4);}let px=world().pipeX-camera,py=groundY-58;ctx.fillStyle=th[5];ctx.fillRect(px+6,py+10,48,48);ctx.fillRect(px,py,60,18);drawPlayer(p,camera,n);if(twoPlayers){ctx.fillStyle='white';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('PLAYER '+n,viewW/2,25);ctx.textAlign='left';}ctx.restore();}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#17213d';ctx.fillRect(0,0,width,height);if(!twoPlayers){viewW=width;viewH=height;groundY=height-(width<600?108:88);drawView(players[0],1,0,0);return;}if(width>height*1.15){viewW=width/2;viewH=height;groundY=height-88;drawView(players[0],1,0,0);drawView(players[1],2,width/2,0);ctx.fillStyle='#fff';ctx.fillRect(width/2-2,0,4,height);}else{viewW=width;viewH=height/2;groundY=viewH-82;drawView(players[0],1,0,0);drawView(players[1],2,0,height/2);ctx.fillStyle='#fff';ctx.fillRect(0,height/2-2,width,4);}}
function frame(now){let dt=lastTime?(now-lastTime)/1000:0;lastTime=now;update(dt);draw();requestAnimationFrame(frame);}
function bind(id,action){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(action==='p1jump')jump(players[0]);else if(action==='p2jump')jump(players[1]);else if(action==='pipe')enterPipe();else keys[action]=true;b.setPointerCapture?.(e.pointerId);});let up=()=>{if(action in keys)keys[action]=false;};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);}
function switchLanguage(){language=language==='en'?'es':'en';$('language').textContent=language==='en'?'ES':'EN';$('screen-language').textContent=language==='en'?'ES':'EN';$('menu-message').textContent=t('intro');$('menu-bottom').textContent=t('controls');$('mode-button').textContent=twoPlayers?t('two'):t('one');$('music').textContent=musicOn?'♫':'♫×';}
$('play').addEventListener('click',start);$('mode-button').addEventListener('click',()=>{twoPlayers=!twoPlayers;document.body.classList.toggle('single-player',!twoPlayers);setView();$('mode-button').textContent=twoPlayers?t('two'):t('one');$('menu-message').textContent=t('intro');});$('language').addEventListener('click',switchLanguage);$('screen-language').addEventListener('click',switchLanguage);$('music').addEventListener('click',()=>{musicOn=!musicOn;$('music').textContent=musicOn?'♫':'♫×';if(musicOn&&running)music();else stopMusic();});
bind('p1left','p1Left');bind('p1right','p1Right');bind('p1jump','p1jump');bind('p2left','p2Left');bind('p2right','p2Right');bind('p2jump','p2jump');bind('pipe','pipe');
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();if(k==='arrowleft')keys.p1Left=true;if(k==='arrowright')keys.p1Right=true;if(k==='arrowup'||k===' ')jump(players[0]);if(k==='arrowdown')enterPipe();if(twoPlayers){if(k==='a')keys.p2Left=true;if(k==='d')keys.p2Right=true;if(k==='w')jump(players[1]);if(k==='s')enterPipe();}});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft')keys.p1Left=false;if(k==='arrowright')keys.p1Right=false;if(k==='a')keys.p2Left=false;if(k==='d')keys.p2Right=false;});addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));addEventListener('resize',resize);resize();setupWorld();menu();requestAnimationFrame(frame);})();
</script>
</body>
</html>
