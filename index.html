<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Temu Bros</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: #617de8;
    color: white;
    font-family: system-ui, sans-serif;
    user-select: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  #hud {
    position: fixed;
    z-index: 2;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    right: 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
    pointer-events: none;
    text-shadow: 0 2px 4px #17213d;
  }

  .badge, .hud-button {
    padding: 8px 10px;
    border: 2px solid #ffffffa8;
    border-radius: 8px;
    color: white;
    background: #17243cbd;
    font: 800 clamp(11px, 3vw, 16px) system-ui, sans-serif;
  }

  .hud-button {
    pointer-events: auto;
    cursor: pointer;
  }

  #controls {
    position: fixed;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: max(14px, env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 14px;
    pointer-events: none;
  }

  .button-group {
    display: flex;
    gap: 9px;
  }

  .control {
    width: clamp(54px, 15vw, 76px);
    height: clamp(54px, 15vw, 76px);
    border: 2px solid #ffffffc0;
    border-radius: 13px;
    color: white;
    background: #30346ddd;
    font-size: 27px;
    font-weight: 900;
    box-shadow: 0 5px 0 #161a4599;
    pointer-events: auto;
    touch-action: none;
  }

  #jump { background: #e95491ee; }
  #action { background: #31a777ee; font-size: 21px; }

  .control:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #161a4599;
  }

  #screen {
    position: fixed;
    z-index: 5;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: auto;
    padding: 22px;
    background: #617de8;
  }

  #screen::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .24;
    background-image:
      linear-gradient(90deg, transparent 96%, #fff 96%),
      linear-gradient(transparent 96%, #fff 96%);
    background-size: 24px 24px;
    pointer-events: none;
  }

  #menu {
    position: relative;
    width: min(620px, 100%);
    padding: 20px;
    text-align: center;
    font-family: "Courier New", monospace;
  }

  .scoreline {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 0 auto 12px;
    max-width: 520px;
    font-size: clamp(12px, 3vw, 18px);
    font-weight: 900;
    text-shadow: 2px 2px #293675;
  }

  #title-plaque {
    margin: 0 auto 22px;
    padding: clamp(20px, 6vw, 38px) 12px;
    width: min(540px, 100%);
    border: 7px solid #793416;
    outline: 4px solid #f7bd83;
    background: #df531d;
    box-shadow: 0 9px 0 #57283a, inset 0 0 0 4px #ff9a55;
    color: #fff0d4;
    text-shadow: 4px 5px 0 #712d28;
  }

  #title-plaque h1 {
    margin: 0;
    font-size: clamp(35px, 11vw, 76px);
    line-height: .95;
    letter-spacing: -4px;
  }

  #title-plaque .subtitle {
    display: block;
    margin-top: 12px;
    font-size: clamp(14px, 4vw, 24px);
    font-weight: 900;
    letter-spacing: 3px;
  }

  #copyright {
    margin: 15px 0 24px;
    font-size: clamp(12px, 3.5vw, 18px);
    font-weight: 900;
  }

  #menu-message {
    min-height: 48px;
    margin: 0 auto 12px;
    max-width: 480px;
    font-family: system-ui, sans-serif;
    font-size: clamp(14px, 3.6vw, 18px);
    font-weight: 700;
    line-height: 1.4;
  }

  #play {
    display: block;
    margin: 10px auto;
    padding: 13px 20px;
    width: min(360px, 100%);
    border: 3px solid #fff2c6;
    border-radius: 4px;
    color: white;
    background: #287e42;
    box-shadow: 0 6px 0 #174b35;
    font: 900 clamp(16px, 4vw, 22px) "Courier New", monospace;
    cursor: pointer;
  }

  #play:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #174b35;
  }

  #menu-bottom {
    margin-top: 18px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
  }

  #screen-language {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 1;
    padding: 8px 12px;
    border: 2px solid white;
    border-radius: 5px;
    color: white;
    background: #293675;
    font-weight: 900;
  }

  .hidden { display: none !important; }

  @media (max-height: 560px) {
    #menu { padding: 8px; }
    #title-plaque { margin-bottom: 12px; padding: 14px 8px; }
    #copyright { margin: 8px 0 12px; }
    #menu-bottom { margin-top: 8px; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Super Temu Bros game"></canvas>

<div id="hud">
  <div class="badge">🪙 <span id="coins">0</span> &nbsp; 💛 <span id="lives">3</span></div>
  <div class="badge" id="levelLabel">WORLD 1-1</div>
  <button class="hud-button" id="language" aria-label="Change language">ES</button>
  <button class="hud-button" id="music" aria-label="Toggle music">♫</button>
</div>

<div id="controls">
  <div class="button-group">
    <button class="control" id="left" aria-label="Move left">◀</button>
    <button class="control" id="right" aria-label="Move right">▶</button>
  </div>
  <div class="button-group">
    <button class="control" id="action" aria-label="Enter pipe">⬇</button>
    <button class="control" id="jump" aria-label="Jump">⬆</button>
  </div>
</div>

<div id="screen">
  <button id="screen-language">ES</button>
  <main id="menu">
    <div class="scoreline">
      <span id="menu-coins">COINS 000</span>
      <span id="menu-world">WORLD 1-1</span>
      <span id="menu-time">READY!</span>
    </div>

    <div id="title-plaque">
      <h1>SUPER<br>TEMU BROS</h1>
      <span class="subtitle">BARGAIN KINGDOM ADVENTURE</span>
    </div>

    <div id="copyright">★ A NEW PIXEL ADVENTURE ★</div>
    <p id="menu-message">
      Six worlds to explore! Collect coins, dodge grumpy parcels, and find the next pipe.
    </p>
    <button id="play">▶ &nbsp; 1 PLAYER GAME</button>
    <div id="menu-bottom">MOVE ◀ ▶ &nbsp; JUMP ⬆ &nbsp; PIPE ⬇</div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);

  let width = innerWidth;
  let height = innerHeight;
  let pixelRatio = 1;
  let groundY = height - 90;
  let cameraX = 0;
  let lastFrameTime = 0;
  let language = "en";
  let running = false;
  let coins = 0;
  let lives = 3;
  let levelIndex = 0;
  let pickups = [];
  let enemies = [];

  const keys = { left: false, right: false };
  const player = {
    x: 60, y: 0, width: 36, height: 48,
    vx: 0, vy: 0, grounded: false, invulnerable: 0
  };

  let audioContext = null;
  let musicTimer = null;
  let musicEnabled = true;
  let musicNote = 0;

  const worldNames = {
    en: [
      "Sunny Sale Hills",
      "Bubblewrap Bay",
      "Cardboard Canyon",
      "Jellybean Jungle",
      "Midnight Market",
      "Golden Checkout"
    ],
    es: [
      "Colinas de ofertas",
      "Bahía de burbujas",
      "Cañón de cartón",
      "Selva de caramelos",
      "Mercado nocturno",
      "Caja dorada"
    ]
  };

  const translations = {
    en: {
      intro: "Six worlds to explore! Collect coins, dodge grumpy parcels, and find the next pipe.",
      start: "▶   1 PLAYER GAME",
      again: "▶   PLAY AGAIN",
      failTitle: "📦 OOPS!",
      winTitle: "🏆 YOU DID IT!",
      fail: "You ran out of lives. Ready for another try?",
      win: "You conquered all six worlds. What a legendary shopping trip!",
      ready: "READY!",
      move: "MOVE ◀ ▶   JUMP ⬆   PIPE ⬇",
      musicOn: "♫",
      musicOff: "♫×"
    },
    es: {
      intro: "¡Explora seis mundos! Recoge monedas, esquiva paquetes gruñones y encuentra la próxima tubería.",
      start: "▶   JUGAR",
      again: "▶   JUGAR DE NUEVO",
      failTitle: "📦 ¡UPS!",
      winTitle: "🏆 ¡LO LOGRASTE!",
      fail: "Te quedaste sin vidas. ¿Listo para intentarlo otra vez?",
      win: "Conquistaste los seis mundos. ¡Qué viaje de compras legendario!",
      ready: "¡LISTO!",
      move: "MOVER ◀ ▶   SALTAR ⬆   TUBERÍA ⬇",
      musicOn: "♫",
      musicOff: "♫×"
    }
  };

  const themes = [
    { skyTop:"#5dc8ff", skyBottom:"#d6f7ff", hill:"#65c88b", ground:"#986044", grass:"#44bd72", pipe:"#2cb75d", coin:"#ffe27a" },
    { skyTop:"#51b8d5", skyBottom:"#c8f4ec", hill:"#47aa9b", ground:"#8b5949", grass:"#42b89c", pipe:"#287f8e", coin:"#ffdc73" },
    { skyTop:"#e89758", skyBottom:"#ffe1a2", hill:"#bb704d", ground:"#765044", grass:"#c78c53", pipe:"#468c65", coin:"#fff08a" },
    { skyTop:"#5ab78d", skyBottom:"#c9f0a2", hill:"#3f9467", ground:"#705642", grass:"#57b95e", pipe:"#32834d", coin:"#ffe46f" },
    { skyTop:"#343b77", skyBottom:"#a8a2e8", hill:"#5555a0", ground:"#634c72", grass:"#6fbe86", pipe:"#59a86a", coin:"#fff0a0" },
    { skyTop:"#f19068", skyBottom:"#ffe5a7", hill:"#d6a64c", ground:"#916047", grass:"#71bd66", pipe:"#40975b", coin:"#fff37a" }
  ];

  // World layouts are generated from each world's settings.
  function makeWorlds() {
    return themes.map((theme, index) => {
      const length = 2400 + index * 240;
      const gapCount = 3 + Math.floor(index / 2);
      const gapWidth = 92 + index * 6;
      const gaps = [];
      const ledges = [];
      const coinSpots = [];
      const enemySpots = [];

      for (let i = 0; i < gapCount; i++) {
        const start = 430 + i * 470;
        gaps.push([start, start + gapWidth]);

        // Low, reachable platforms near gaps.
        ledges.push([start - 155, 108 + (i % 2) * 10, 78 + (index % 3) * 8]);
        coinSpots.push([start - 112, 145 + (i % 2) * 12]);
        coinSpots.push([start + gapWidth + 58, 68]);

        const enemyX = start + gapWidth + 135;
        if (enemyX < length - 210) {
          enemySpots.push([
            enemyX,
            enemyX - 45,
            enemyX + 70,
            55 + index * 9
          ]);
        }
      }

      // Extra raised platforms and coins make each world feel distinct.
      for (let i = 0; i < 3; i++) {
        const x = 250 + i * 660 + index * 25;
        if (x + 140 < length - 180) {
          ledges.push([x, 118, 100 + ((i + index) % 3) * 12]);
          coinSpots.push([x + 50, 145 + ((i + index) % 3) * 12]);
        }
      }

      return {
        length,
        gaps,
        ledges,
        coins: coinSpots,
        enemies: enemySpots,
        pipeX: length - 105
      };
    });
  }

  const worlds = makeWorlds();

  function t(key) {
    return translations[language][key];
  }

  function currentWorld() {
    return worlds[levelIndex];
  }

  function worldLabel() {
    return `WORLD ${levelIndex + 1}-1`;
  }

  function setCanvasSize() {
    width = innerWidth;
    height = innerHeight;
    pixelRatio = Math.min(devicePixelRatio || 1, 2);

    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

    groundY = height - (width < 600 ? 108 : 88);

    for (const pickup of pickups) {
      pickup.y = groundY - pickup.height;
    }

    if (!running) {
      player.y = groundY - player.height;
    }

    updateHud();
  }

  function updateHud() {
    $("coins").textContent = coins;
    $("lives").textContent = lives;
    $("levelLabel").textContent = worldLabel();
    $("menu-world").textContent = worldLabel();
    $("menu-coins").textContent = `COINS ${String(coins).padStart(3, "0")}`;
  }

  function prepareWorld() {
    const world = currentWorld();

    pickups = world.coins.map(([x, coinHeight]) => ({
      x,
      height: coinHeight,
      y: groundY - coinHeight,
      collected: false
    }));

    enemies = world.enemies.map(([x, min, max, speed]) => ({
      x, min, max, speed, direction: 1, alive: true
    }));

    player.x = 60;
    player.y = groundY - player.height;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.invulnerable = 0;
    cameraX = 0;
    updateHud();
  }

  function startGame() {
    coins = 0;
    lives = 3;
    levelIndex = 0;
    prepareWorld();
    running = true;
    $("screen").classList.add("hidden");
    startMusic();
    lastFrameTime = performance.now();
  }

  function endGame(won) {
    running = false;
    stopMusic();

    $("title-plaque").innerHTML = won
      ? `<h1>WORLD<br>COMPLETE!</h1><span class="subtitle">SUPER TEMU BROS</span>`
      : `<h1>GAME<br>OVER</h1><span class="subtitle">SUPER TEMU BROS</span>`;

    $("menu-message").textContent = won ? t("win") : t("fail");
    $("play").textContent = t("again");
    $("screen").classList.remove("hidden");
  }

  function startMusic() {
    if (!musicEnabled) return;

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;

    audioContext ||= new AudioContextClass();
    audioContext.resume();
    clearInterval(musicTimer);

    // Original chiptune notes, written for this game.
    const notes = [523,659,784,659,587,698,880,698,523,659,784,988,880,784,659,587];

    musicTimer = setInterval(() => {
      if (!running || !musicEnabled || !audioContext) return;

      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "square";
      oscillator.frequency.value = notes[musicNote++ % notes.length];
      gain.gain.setValueAtTime(0.022, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.14);
    }, 175);
  }

  function stopMusic() {
    clearInterval(musicTimer);
  }

  function jump() {
    if (running && player.grounded) {
      player.vy = -680;
      player.grounded = false;
    }
  }

  function enterPipe() {
    if (!running || !player.grounded) return;

    const distance = Math.abs(
      player.x + player.width / 2 - currentWorld().pipeX
    );

    if (distance > 72) return;

    if (levelIndex < worlds.length - 1) {
      levelIndex++;
      prepareWorld();
    } else {
      endGame(true);
    }
  }

  function overlaps(a, b) {
    return a.x < b.x + b.width &&
      a.x + a.width > b.x &&
      a.y < b.y + b.height &&
      a.y + a.height > b.y;
  }

  function loseLife() {
    if (!running || player.invulnerable > 0) return;

    lives--;
    updateHud();

    if (lives <= 0) {
      endGame(false);
      return;
    }

    player.x = 60;
    player.y = groundY - player.height - 4;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.invulnerable = 1.5;
    cameraX = 0;
  }

  function isOverGap() {
    const playerCenter = player.x + player.width / 2;
    return currentWorld().gaps.some(
      ([start, end]) => playerCenter > start && playerCenter < end
    );
  }

  function update(deltaTime) {
    if (!running) return;

    const dt = Math.min(deltaTime, 0.033);
    const world = currentWorld();

    player.invulnerable = Math.max(0, player.invulnerable - dt);
    player.vx = ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * 300;
    player.x = Math.max(
      0,
      Math.min(world.length - player.width, player.x + player.vx * dt)
    );

    const previousBottom = player.y + player.height;
    player.vy += 1750 * dt;
    player.y += player.vy * dt;
    player.grounded = false;

    // Ground collision, except over gaps.
    if (
      !isOverGap() &&
      player.vy >= 0 &&
      previousBottom <= groundY + 2 &&
      player.y + player.height >= groundY
    ) {
      player.y = groundY - player.height;
      player.vy = 0;
      player.grounded = true;
    }

    // Raised platform collision.
    for (const [platformX, platformWidth, platformHeight] of world.ledges) {
      const platformY = groundY - platformHeight;
      const overPlatform =
        player.x + player.width > platformX &&
        player.x < platformX + platformWidth;

      if (
        overPlatform &&
        player.vy >= 0 &&
        previousBottom <= platformY + 3 &&
        player.y + player.height >= platformY
      ) {
        player.y = platformY - player.height;
        player.vy = 0;
        player.grounded = true;
      }
    }

    // Collect coins.
    for (const pickup of pickups) {
      if (pickup.collected) continue;

      if (overlaps(player, {
        x: pickup.x - 11,
        y: pickup.y - 12,
        width: 22,
        height: 24
      })) {
        pickup.collected = true;
        coins++;
        updateHud();
      }
    }

    // Enemies can be jumped on or avoided.
    for (const enemy of enemies) {
      if (!enemy.alive) continue;

      enemy.x += enemy.direction * enemy.speed * dt;
      if (enemy.x < enemy.min || enemy.x > enemy.max) {
        enemy.direction *= -1;
        enemy.x = Math.max(enemy.min, Math.min(enemy.max, enemy.x));
      }

      const enemyBox = {
        x: enemy.x,
        y: groundY - 31,
        width: 34,
        height: 31
      };

      if (!overlaps(player, enemyBox)) continue;

      if (player.vy > 100 && previousBottom <= enemyBox.y + 14) {
        enemy.alive = false;
        player.vy = -390;
      } else {
        loseLife();
      }
      break;
    }

    if (player.y > height + 80) {
      loseLife();
    }

    if (!running) return;

    cameraX = Math.max(
      0,
      Math.min(world.length - width, player.x - width * 0.36)
    );
    updateHud();
  }

  function drawBackground(theme) {
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, theme.skyTop);
    gradient.addColorStop(1, theme.skyBottom);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < 9; i++) {
      const x = i * 310 - (cameraX * 0.18 % 310);
      ctx.fillStyle = theme.hill;
      ctx.beginPath();
      ctx.ellipse(x + 130, groundY + 8, 170, 95, 0, Math.PI, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "#ffffffdd";
    for (let i = 0; i < 7; i++) {
      const x = ((i * 270 - cameraX * 0.12) % (width + 280) + width + 280) % (width + 280) - 100;
      const y = 76 + (i % 3) * 48;

      ctx.beginPath();
      ctx.arc(x, y, 23, 0, Math.PI * 2);
      ctx.arc(x + 29, y - 12, 31, 0, Math.PI * 2);
      ctx.arc(x + 60, y, 23, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround(start, end, theme) {
    const x = start - cameraX;
    const groundWidth = end - start;

    if (x > width || x + groundWidth < 0) return;

    ctx.fillStyle = theme.grass;
    ctx.fillRect(x, groundY, groundWidth, 14);
    ctx.fillStyle = theme.ground;
    ctx.fillRect(x, groundY + 14, groundWidth, height - groundY);

    ctx.fillStyle = "#ffffff25";
    for (let tileX = x + 18; tileX < x + groundWidth; tileX += 58) {
      ctx.fillRect(tileX, groundY + 36, 27, 4);
    }
  }

  function drawPipe(x, theme, active) {
    const screenX = x - cameraX;
    const y = groundY - 62;

    ctx.fillStyle = theme.pipe;
    ctx.fillRect(screenX + 7, y + 10, 52, 52);
    ctx.fillRect(screenX, y, 66, 19);

    ctx.fillStyle = "#ffffff50";
    ctx.fillRect(screenX + 7, y + 3, 10, 12);
    ctx.fillStyle = "#00000020";
    ctx.fillRect(screenX + 54, y + 4, 8, 55);

    if (active) {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 15px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("⬇", screenX + 33, y - 8);
      ctx.textAlign = "left";
    }
  }

  function drawPlayer() {
    if (
      player.invulnerable > 0 &&
      Math.floor(player.invulnerable * 12) % 2 === 0
    ) return;

    const x = player.x - cameraX;
    const y = player.y;

    // Original delivery-runner character.
    ctx.fillStyle = "#173d4d";
    ctx.fillRect(x + 5, y + 42, 12, 6);
    ctx.fillRect(x + 21, y + 42, 12, 6);

    ctx.fillStyle = "#f07a3d";
    ctx.fillRect(x + 6, y + 8, 25, 9);
    ctx.fillRect(x + 2, y + 14, 32, 5);

    ctx.fillStyle = "#f3bd8e";
    ctx.fillRect(x + 8, y + 16, 22, 18);

    ctx.fillStyle = "#293449";
    ctx.fillRect(x + 14, y + 22, 3, 4);
    ctx.fillRect(x + 24, y + 22, 3, 4);

    ctx.fillStyle = "#70443c";
    ctx.fillRect(x + 14, y + 29, 12, 3);

    ctx.fillStyle = "#138b91";
    ctx.fillRect(x + 5, y + 33, 27, 13);

    ctx.fillStyle = "#ffd451";
    ctx.fillRect(x + 27, y + 34, 9, 12);
    ctx.fillStyle = "#fff0a3";
    ctx.fillRect(x + 29, y + 36, 5, 3);

    ctx.fillStyle = "#f3bd8e";
    ctx.fillRect(x + 1, y + 34, 6, 11);
  }

  function drawEnemy(enemy) {
    if (!enemy.alive) return;

    const x = enemy.x - cameraX;
    const y = groundY - 31;

    ctx.fillStyle = "#8d5be8";
    ctx.fillRect(x, y + 5, 34, 26);

    ctx.fillStyle = "#f5bc57";
    ctx.fillRect(x + 5, y, 24, 8);

    ctx.fillStyle = "#fff";
    ctx.fillRect(x + 7, y + 12, 6, 6);
    ctx.fillRect(x + 21, y + 12, 6, 6);

    ctx.fillStyle = "#33234b";
    ctx.fillRect(x + 9, y + 14, 3, 4);
    ctx.fillRect(x + 23, y + 14, 3, 4);

    ctx.fillStyle = "#7043bf";
    ctx.fillRect(x + 3, y + 29, 11, 4);
    ctx.fillRect(x + 21, y + 29, 11, 4);
  }

  function draw() {
    const theme = themes[levelIndex];
    const world = currentWorld();

    drawBackground(theme);

    let groundStart = 0;
    for (const [gapStart, gapEnd] of world.gaps) {
      drawGround(groundStart, gapStart, theme);
      groundStart = gapEnd;
    }
    drawGround(groundStart, world.length, theme);

    for (const [x, platformWidth, platformHeight] of world.ledges) {
      const screenX = x - cameraX;
      const y = groundY - platformHeight;

      ctx.fillStyle = theme.grass;
      ctx.fillRect(screenX, y, platformWidth, 11);
      ctx.fillStyle = theme.ground;
      ctx.fillRect(screenX, y + 11, platformWidth, 8);
      ctx.fillStyle = "#ffffff55";
      ctx.fillRect(screenX + 5, y + 3, platformWidth - 10, 3);
    }

    for (const pickup of pickups) {
      if (pickup.collected) continue;

      const x = pickup.x - cameraX;
      ctx.fillStyle = theme.coin;
      ctx.beginPath();
      ctx.ellipse(x, pickup.y, 10, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff7c0";
      ctx.fillRect(x - 2, pickup.y - 8, 4, 16);
    }

    for (const enemy of enemies) drawEnemy(enemy);

    const nearPipe =
      player.grounded &&
      Math.abs(player.x + player.width / 2 - world.pipeX) < 90;

    drawPipe(world.pipeX, theme, nearPipe);
    drawPlayer();
  }

  function frame(now) {
    const deltaTime = lastFrameTime ? (now - lastFrameTime) / 1000 : 0;
    lastFrameTime = now;
    update(deltaTime);
    draw();
    requestAnimationFrame(frame);
  }

  function bindControl(id, action) {
    const button = $(id);

    button.addEventListener("pointerdown", event => {
      event.preventDefault();

      if (action === "jump") jump();
      else if (action === "pipe") enterPipe();
      else keys[action] = true;

      if (button.setPointerCapture) button.setPointerCapture(event.pointerId);
    });

    const release = () => {
      if (action === "left" || action === "right") keys[action] = false;
    };

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
  }

  function toggleLanguage() {
    language = language === "en" ? "es" : "en";
    $("language").textContent = language === "en" ? "ES" : "EN";
    $("screen-language").textContent = language === "en" ? "ES" : "EN";
    $("menu-message").textContent = t("intro");
    $("menu-bottom").textContent = t("move");
    $("play").textContent = t("start");
    $("music").textContent = musicEnabled ? t("musicOn") : t("musicOff");
    updateHud();
  }

  $("play").addEventListener("click", startGame);
  $("language").addEventListener("click", toggleLanguage);
  $("screen-language").addEventListener("click", toggleLanguage);

  $("music").addEventListener("click", () => {
    musicEnabled = !musicEnabled;
    $("music").textContent = musicEnabled ? t("musicOn") : t("musicOff");
    if (musicEnabled && running) startMusic();
    else stopMusic();
  });

  bindControl("left", "left");
  bindControl("right", "right");
  bindControl("jump", "jump");
  bindControl("action", "pipe");

  addEventListener("keydown", event => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(event.key)) {
      event.preventDefault();
    }

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") keys.left = true;
    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") keys.right = true;
    if (event.key === "ArrowUp" || event.key === " ") jump();
    if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") enterPipe();
  });

  addEventListener("keyup", event => {
    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") keys.left = false;
    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") keys.right = false;
  });

  addEventListener("blur", () => {
    keys.left = false;
    keys.right = false;
  });

  setCanvasSize();
  prepareWorld();
  $("menu-message").textContent = t("intro");
  $("menu-bottom").textContent = t("move");
  $("play").textContent = t("start");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
